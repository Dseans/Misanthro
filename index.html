<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Wreak</title>
<style>
  :root {
    --background:#1a1620; --foreground:#f1ece5; --card:#241f2a;
    --muted:#9a90a5; --border:rgba(255,255,255,0.14);
    --destructive:#e2554f; --primary:#e2a34f; --accent:#8ff0c4;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; color:var(--foreground);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .stage { position:fixed; inset:0; background:#000; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; image-rendering: pixelated; object-fit: contain; }
  .hud-top { position:absolute; top:0; left:0; right:0; padding:14px 16px; display:flex; align-items:flex-start;
    justify-content:space-between; pointer-events:none; font-size:10px; letter-spacing:.18em; text-transform:uppercase;
    text-shadow:0 1px 3px rgba(0,0,0,.9); }
  .vitals { width:min(38vw,260px); }
  .vitals-row { display:flex; justify-content:space-between; font-size:9px; letter-spacing:.18em; color:var(--muted); margin-bottom:4px; }
  .bar-hp { height:6px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; }
  .bar-hp-inner { height:100%; border-radius:99px; background:linear-gradient(90deg,#e2554f,#ff8d6a); transition:width .15s ease; }
  .bar-rage { height:3px; margin-top:4px; border-radius:99px; background:rgba(255,255,255,.1); overflow:hidden; }
  .bar-rage-inner { height:100%; border-radius:99px; background:var(--primary); transition:width .15s ease; }
  .bar-stamina { height:3px; margin-top:4px; border-radius:99px; background:rgba(255,255,255,.1); overflow:hidden; }
  .bar-stamina-inner { height:100%; border-radius:99px; background:var(--accent); transition:width .1s ease; }
  .boost-tag { display:none; margin-top:6px; padding:2px 7px; border-radius:99px; background:rgba(143,240,196,.22);
    color:var(--accent); font-size:7px; letter-spacing:.18em; }
  .floor-label { margin-top:8px; font-size:9px; color:var(--muted); letter-spacing:.24em; }
  .enemies { text-align:right; color:var(--muted); font-size:9px; letter-spacing:.24em; }
  .enemies .num { color:var(--destructive); font-size:18px; letter-spacing:0; margin-top:2px; }
  .bossbar { position:absolute; top:18px; left:50%; transform:translateX(-50%); width:min(60vw,420px); pointer-events:none; }
  .bossbar .name { text-align:center; font-size:9px; letter-spacing:.32em; text-transform:uppercase; color:var(--destructive); margin-bottom:4px; }
  .bar-outer { height:5px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; }
  .bar-inner { height:100%; border-radius:99px; background:var(--destructive); transition:width .12s; }
  .hud-bottom { position:absolute; left:16px; bottom:16px; }
  .weapon-panel { display:flex; align-items:center; gap:6px; margin-bottom:6px; font-size:8px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--foreground); text-shadow:0 1px 3px rgba(0,0,0,.9); }
  .weapon-panel .wname { min-width:70px; }
  .bar-durability { width:56px; height:4px; border-radius:99px; background:rgba(255,255,255,.14); overflow:hidden; }
  .bar-durability-inner { height:100%; border-radius:99px; background:#e2a34f; transition:width .15s ease; }
  .btn-grid { display:flex; flex-wrap:wrap; gap:6px; }
  .action-btn { display:flex; align-items:center; gap:6px; border:0; background:rgba(255,255,255,.07); backdrop-filter:blur(6px);
    padding:7px 10px; border-radius:99px; font-family:inherit; font-size:8px; text-transform:uppercase; letter-spacing:.14em;
    color:var(--foreground); cursor:pointer; user-select:none; touch-action:none; -webkit-user-select:none; transition:background .15s, opacity .15s; }
  .action-btn:active, .action-btn.held { background:rgba(226,163,79,.32); }
  .action-btn .key { color:var(--muted); }
  .action-btn.on-cooldown { opacity:.35; pointer-events:none; }
  .action-btn #heavy-cd { color:var(--primary); font-weight:700; }
  .movepad { position:absolute; right:16px; bottom:16px; display:flex; gap:6px; }
  .pad-btn { width:40px; height:40px; border-radius:99px; border:0; background:rgba(255,255,255,.07); backdrop-filter:blur(6px);
    color:var(--foreground); font-size:15px; touch-action:none; user-select:none; transition:background .15s; }
  .pad-btn:active, .pad-btn.held { background:rgba(226,163,79,.32); }

  .mobile-gamepad, .fullscreen-btn { display:none; }
  .mobile-gamepad { position:absolute; z-index:20; pointer-events:none; }
  .mobile-gamepad button, .fullscreen-btn { font:700 12px/1 ui-monospace, "SF Mono", Menlo, monospace; -webkit-tap-highlight-color:transparent; }
  .mobile-gamepad button { pointer-events:auto; touch-action:none; user-select:none; -webkit-user-select:none; }
  .dpad { position:absolute; width:132px; height:132px; }
  .dpad-btn { position:absolute; width:46px; height:46px; border:1px solid rgba(255,255,255,.45); background:linear-gradient(#9b57ff,#6b0be6); color:#fff; box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 3px 0 #36007c; }
  .dpad-btn.held { background:#c29aff; transform:translateY(2px); box-shadow:inset 0 2px 4px rgba(42,0,93,.55),0 1px 0 #36007c; }
  .dpad-up { left:43px; top:0; border-radius:10px 10px 3px 3px; }
  .dpad-left { left:0; top:43px; border-radius:10px 3px 3px 10px; }
  .dpad-center { position:absolute; left:43px; top:43px; width:46px; height:46px; background:#771de8; }
  .dpad-right { right:0; top:43px; border-radius:3px 10px 10px 3px; }
  .dpad-down { left:43px; bottom:0; border-radius:3px 3px 10px 10px; }
  .face-buttons { position:absolute; width:220px; height:186px; }
  .face-btn { position:absolute; width:50px; height:50px; border-radius:50%; border:2px solid rgba(255,255,255,.7); background:linear-gradient(#a84fff,#6a00d9); color:#fff; box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 3px 0 #350071; font-size:7px; font-weight:700; letter-spacing:.5px; display:flex; align-items:center; justify-content:center; }
  .face-btn.held { background:#d0a6ff; transform:translateY(2px); box-shadow:inset 0 2px 5px rgba(42,0,93,.6),0 1px 0 #350071; }
  .face-a { right:6px; top:0; }
  .face-b { right:64px; top:48px; }
  .face-ab { right:4px; top:94px; width:48px; height:48px; font-size:7px !important; }
  .utility-buttons { position:absolute; left:0; top:8px; width:104px; height:164px; }
  .utility-btn { position:absolute; width:48px; height:48px; border:2px solid rgba(255,255,255,.6); border-radius:50%; background:linear-gradient(#7f35d9,#44009e); color:#fff; font-size:7px !important; box-shadow:inset 0 2px 0 rgba(255,255,255,.24),0 3px 0 #28005d; }
  .utility-btn:nth-child(1) { left:0; top:0; }
  .utility-btn:nth-child(2) { left:48px; top:52px; }
  .utility-btn:nth-child(3) { left:0; top:106px; }
  .utility-btn.held { background:#c29aff; color:#270052; transform:translateY(2px); box-shadow:inset 0 2px 5px rgba(42,0,93,.6),0 1px 0 #28005d; }
  .fullscreen-btn { position:absolute; z-index:30; width:38px; height:38px; padding:0; border:1px solid rgba(255,255,255,.42); border-radius:8px; background:rgba(24,8,34,.72); color:#fff; backdrop-filter:blur(8px); align-items:center; justify-content:center; touch-action:manipulation; }
  .fullscreen-btn svg { width:20px; height:20px; }
  .sys-buttons { position:absolute; left:50%; bottom:max(14px,env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; gap:26px; align-items:flex-end; }
  .sys-btn { background:none; border:0; padding:8px 4px 4px; display:flex; flex-direction:column; align-items:center; gap:7px; touch-action:manipulation; cursor:pointer; }
  .sys-pill { display:block; width:46px; height:15px; border-radius:99px; background:linear-gradient(#a19aab,#615a6b); border:1px solid rgba(0,0,0,.35); box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 #2c2733,0 4px 6px rgba(0,0,0,.4); transform:rotate(-26deg); transition:transform .08s, box-shadow .08s; }
  .sys-btn:active .sys-pill, .sys-btn.held .sys-pill { transform:rotate(-26deg) translateY(3px); background:linear-gradient(#7b7486,#4a4453); box-shadow:inset 0 2px 3px rgba(0,0,0,.45),0 0 0 #2c2733; }
  .sys-label { font-size:7px; letter-spacing:.22em; color:rgba(255,255,255,.85); transform:rotate(-26deg); text-shadow:0 1px 2px rgba(0,0,0,.5); }
  .sys-btn.active .sys-label { color:#ffd98a; }

  @media (pointer:coarse), (max-width:900px) {
    .hud-bottom, .movepad { display:none; }
    .mobile-gamepad { display:block; }
    .fullscreen-btn { display:flex; top:max(10px,env(safe-area-inset-top)); right:max(10px,env(safe-area-inset-right)); }
    .hud-top { padding:max(10px,env(safe-area-inset-top)) max(58px,calc(env(safe-area-inset-right) + 50px)) 10px max(10px,env(safe-area-inset-left)); }
    .floor-label { max-width:45vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  }

  @media (pointer:coarse) and (orientation:landscape), (max-width:900px) and (orientation:landscape) {
    .mobile-gamepad { inset:0; }
    .dpad { left:max(18px,env(safe-area-inset-left)); bottom:max(14px,env(safe-area-inset-bottom)); transform:scale(.78); transform-origin:bottom left; }
    .face-buttons { right:max(12px,env(safe-area-inset-right)); bottom:max(8px,env(safe-area-inset-bottom)); transform:scale(.66); transform-origin:bottom right; }
    .utility-buttons { display:block; }
    .hud-top { font-size:8px; }
    .vitals { width:min(31vw,220px); }
  }

  @media (pointer:coarse) and (orientation:portrait), (max-width:900px) and (orientation:portrait) {
    .stage { background:linear-gradient(to bottom,#050307 0 43%,#8614ed 43% 100%); }
    canvas { inset:0 0 auto; height:43%; background:#000; border-bottom:3px solid rgba(255,255,255,.2); }
    .hud-top { height:43%; padding-top:max(8px,env(safe-area-inset-top)); }
    .bossbar { top:12px; width:44vw; }
    .mobile-gamepad { left:0; right:0; top:43%; bottom:0; background:linear-gradient(145deg,#8e16f4,#5d00c6); border-top:1px solid rgba(255,255,255,.28); }
    .mobile-gamepad::before { content:"IRON ENFORCERS"; position:absolute; top:18px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.82); font-size:9px; letter-spacing:.2em; white-space:nowrap; }
    .dpad { left:max(22px,env(safe-area-inset-left)); top:27%; transform:scale(.9); transform-origin:left top; }
    .face-buttons { right:max(18px,env(safe-area-inset-right)); top:22%; transform:scale(.9); transform-origin:right top; }
    .utility-buttons { display:block; }
    .fullscreen-btn { top:calc(43% + 12px); }
    .enemies { padding-right:0; }
    .floor-label { max-width:58vw; }
  }

  @media (pointer:coarse) and (orientation:portrait) and (max-height:680px) {
    .dpad { transform:scale(.72); }
    .face-buttons { transform:scale(.7); }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="game"></canvas>

    <div class="hud-top">
      <div class="vitals">
        <div class="vitals-row"><span>Vitals</span><span id="hud-hp-text">100/100</span></div>
        <div class="bar-hp"><div class="bar-hp-inner" id="hud-hp-bar" style="width:100%"></div></div>
        <div class="bar-rage"><div class="bar-rage-inner" id="hud-rage-bar" style="width:0%"></div></div>
        <div class="bar-stamina"><div class="bar-stamina-inner" id="hud-stamina-bar" style="width:100%"></div></div>
        <div class="boost-tag" id="hud-boost">ATK +30%</div>
        <div class="floor-label"><span id="hud-floor-name">Floor 1</span> · <span id="hud-floor-sub">Cafeteria &amp; Main Hallways</span></div>
      </div>
      <div class="enemies">
        <div>Enemies</div>
        <div class="num" id="hud-enemies">0</div>
      </div>
    </div>

    <div class="bossbar" id="bossbar" style="display:none">
      <div class="name" id="boss-name">—</div>
      <div class="bar-outer"><div class="bar-inner" id="boss-hp" style="width:100%"></div></div>
    </div>

    <div class="hud-bottom">
      <div class="weapon-panel">
        <span class="wname" id="hud-weapon-name">Fists</span>
        <div class="bar-durability"><div class="bar-durability-inner" id="hud-weapon-bar" style="width:100%"></div></div>
      </div>
      <div class="btn-grid">
        <button class="action-btn" data-action="light"><span class="key">LMB</span><span>Light</span></button>
        <button class="action-btn" data-action="heavy" id="heavy-btn"><span class="key">RMB</span><span>Heavy</span><span id="heavy-cd"></span></button>
        <button class="action-btn" data-action="block"><span class="key">F</span><span>Block</span></button>
        <button class="action-btn" data-action="roll"><span class="key">Shift</span><span>Roll</span></button>
        <button class="action-btn" data-action="grab"><span class="key">E</span><span>Grab/Drop</span></button>
        <button class="action-btn" data-action="heal" id="heal-btn"><span class="key">H</span><span>2nd Wind</span></button>
      </div>
    </div>

    <div class="movepad">
      <button class="pad-btn" data-action="left">&#8592;</button>
      <button class="pad-btn" data-action="up">&#8593;</button>
      <button class="pad-btn" data-action="right">&#8594;</button>
    </div>

    <button class="fullscreen-btn" id="fullscreen-btn" type="button" aria-label="Enter fullscreen" title="Fullscreen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
    </button>

    <div class="mobile-gamepad" aria-label="Touch game controls">
      <div class="dpad" aria-label="Directional pad">
        <button class="dpad-btn dpad-up" data-action="up" aria-label="Up">▲</button>
        <button class="dpad-btn dpad-left" data-action="left" aria-label="Left">◀</button>
        <span class="dpad-center" aria-hidden="true"></span>
        <button class="dpad-btn dpad-right" data-action="right" aria-label="Right">▶</button>
        <button class="dpad-btn dpad-down" data-action="down" aria-label="Down">▼</button>
      </div>
      <div class="face-buttons" aria-label="Action buttons">
        <button class="face-btn face-a" data-action="light" aria-label="Light attack">LIGHT</button>
        <button class="face-btn face-b" data-action="heavy" aria-label="Heavy attack">HEAVY</button>
        <button class="face-btn face-ab" data-action="block" aria-label="Block">BLOCK</button>
        <div class="utility-buttons">
          <button class="utility-btn" data-action="roll" aria-label="Roll">ROLL</button>
          <button class="utility-btn" data-action="grab" aria-label="Grab or drop">GRAB</button>
          <button class="utility-btn" data-action="heal" aria-label="Second wind">HEAL</button>
        </div>
      </div>
      <div class="sys-buttons" aria-label="System buttons">
        <button class="sys-btn" id="pause-btn" type="button" aria-label="Pause"><span class="sys-pill"></span><span class="sys-label">PAUSE</span></button>
        <button class="sys-btn" id="restart-btn" type="button" aria-label="Restart"><span class="sys-pill"></span><span class="sys-label">RESTART</span></button>
      </div>
    </div>
  </div>

const UNIFORM = {

  shirt: [[242,235,222],[215,207,196],[255,250,239],[229,221,210]],

const SKIN = [236,170,132];
const SHOE_SOURCE = [238,238,232];
const DARKS = new Set(["10,12,17","15,18,24","20,24,31","24,27,34","28,31,39","31,34,42","31,35,43","37,42,51","45,49,58"]);

function sameRgb(d, i, c) { return d[i] === c[0] && d[i+1] === c[1] && d[i+2] === c[2]; }
function setRgb(d, i, c) { d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2]; }
function uniformSprite(source, name, bald = false) {
  const meta = SPRITE_META[name];
  const canvas = document.createElement("canvas");
  canvas.width = source.width; canvas.height = source.height;
  const c = canvas.getContext("2d"); c.imageSmoothingEnabled = false; c.drawImage(source,0,0);
  const image = c.getImageData(0,0,canvas.width,canvas.height), d=image.data;
  for (let f=0; f<meta.frames; f++) {
    const ox=f*meta.fw, foot=SPRITE_FOOT_X[name]?.[f] ?? meta.fw/2;
    const skins=[];
    for(let y=0;y<Math.floor(meta.fh*.55);y++) for(let x=0;x<meta.fw;x++) {
      const i=((y*canvas.width)+(ox+x))*4;
      if(sameRgb(d,i,SKIN)) skins.push([x,y]);
    }
    if(!skins.length) continue;
    const top=Math.min(...skins.map(v=>v[1]));
    const headSkins=skins.filter(v=>v[1] < top+23);
    const cx=headSkins.length ? Math.round(headSkins.reduce((a,v)=>a+v[0],0)/headSkins.length) : Math.round(foot);
    const headLeft=Math.min(...headSkins.map(v=>v[0])), headRight=Math.max(...headSkins.map(v=>v[0]));
    const neckY=Math.min(meta.fh-1,top+22);
    const hipY=neckY+33;
    for(let y=0;y<meta.fh;y++) for(let x=0;x<meta.fw;x++) {
      const i=((y*canvas.width)+(ox+x))*4;
      const clothIndex=SOURCE_CLOTH.findIndex(col=>sameRgb(d,i,col));
      if(clothIndex>=0) {
        const shade=clothIndex===0?0:clothIndex===1?1:clothIndex===2?2:3;
        // Full tan cardigan above the hips and black school trousers below, matching the supplied design.
        const part = y>=hipY ? UNIFORM.pants
          : UNIFORM.vest;
        setRgb(d,i,part[shade]);
      }
      // Every pale footwear pixel becomes a polished black school shoe, including
      // the brighter highlights used by the fallen and attack frames.
      const paleFootwear = y>=hipY && d[i]>175 && d[i+1]>175 && d[i+2]>175
        && Math.max(d[i],d[i+1],d[i+2])-Math.min(d[i],d[i+1],d[i+2])<42;
      if(paleFootwear || (y>=hipY && sameRgb(d,i,SHOE_SOURCE))) setRgb(d,i,UNIFORM.shoe);
      if(bald && y>=top-12 && y<=top+16 && x>=headLeft-9 && x<=headRight+9 && DARKS.has(`${d[i]},${d[i+1]},${d[i+2]}`)) {
        // Plain round skull: every hair pixel becomes bare skin, no scalp cap or outline.
        setRgb(d,i,SKIN);
      }

    }
    const paint=(x,y,col)=>{ if(x<0||x>=meta.fw||y<0||y>=meta.fh)return; const i=((y*canvas.width)+(ox+x))*4; if(d[i+3]) setRgb(d,i,col); };
    // Crisp white collar, slim black tie, cardigan buttons, and pink student badge.
    for(let k=0;k<7;k++) { paint(cx-5+Math.floor(k/2),neckY+k,UNIFORM.shirt[2]); paint(cx+5-Math.floor(k/2),neckY+k,UNIFORM.shirt[2]); }
    for(let k=0;k<5;k++) paint(cx,neckY+5+k,UNIFORM.ink);
    paint(cx,neckY+14,UNIFORM.ink); paint(cx,neckY+22,UNIFORM.ink); paint(cx,neckY+30,UNIFORM.ink);
    for(let yy=neckY+11;yy<neckY+15;yy++) for(let xx=cx+5;xx<cx+11;xx++) paint(xx,yy,UNIFORM.badge);
    paint(cx+6,neckY+12,UNIFORM.badgeInk); paint(cx+8,neckY+12,UNIFORM.badgeInk);

  }
  c.putImageData(image,0,0);
  // The source sheet contains one rainbow impact-flash frame. Keep the animation
  // readable and the uniform intact by using the adjacent clean hurt pose instead.
  if(name==="HURT" && meta.frames>1) c.drawImage(canvas,0,0,meta.fw,meta.fh,meta.fw,0,meta.fw,meta.fh);
  return canvas;
}
const ENEMY_ATTACK_SHEET = {
