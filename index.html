<style>

  .utility-btn:nth-child(1) { left:0; top:0; }
  .utility-btn:nth-child(2) { left:48px; top:52px; }
  .utility-btn:nth-child(3) { left:0; top:106px; }

  .fullscreen-btn { position:absolute; z-index:30; width:38px; height:38px; padding:0; border:1px solid rgba(255,255,255,.42); border-radius:8px; background:rgba(24,8,34,.72); color:#fff; backdrop-filter:blur(8px); align-items:center; justify-content:center; touch-action:manipulation; }
  .fullscreen-btn svg { width:20px; height:20px; }
  .sys-buttons { position:absolute; left:50%; bottom:max(14px,env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; gap:26px; align-items:flex-end; }
  .sys-btn { background:none; border:0; padding:8px 4px 4px; display:flex; flex-direction:column; align-items:center; gap:7px; touch-action:manipulation; cursor:pointer; }

  @media (pointer:coarse), (max-width:900px) {

  }

  @media (pointer:coarse) and (orientation:landscape), (max-width:900px) and (orientation:landscape) {

    .face-buttons { right:max(12px,env(safe-area-inset-right)); bottom:max(8px,env(safe-area-inset-bottom)); transform:scale(.76); transform-origin:bottom right; }

  /* Battle-worn controls treatment */
  .weapon-panel { border:1px solid var(--border); border-radius:16px 22px 15px 19px; padding:6px 10px; background:rgba(13,11,9,.62); }

  .dpad-btn { border-color:rgba(233,226,209,.3); background:linear-gradient(#4b3b2d,#21170f); color:#e9e2d1; box-shadow:inset 0 2px 0 rgba(255,255,255,.1),0 3px 0 #0d0906; }

  /* Pixel HUD treatment — control geometry intentionally unchanged */
  :root {
    --background:#0d0c0a; --foreground:#f2dfb3; --card:#17130f;
    --muted:#a89a78; --border:#695c42; --destructive:#c43b32;
    --primary:#e3aa36; --accent:#65a563; --ink:#080706;
    --pixel-hi:#a99162; --pixel-mid:#443a29; --pixel-low:#211c15;

  .hud-top { padding:12px 14px; font-size:7px; letter-spacing:0; text-shadow:2px 2px 0 #080706; }
  .vitals,.enemies {

  }

  .bar-rage,.bar-stamina,.bar-outer,.bar-durability {
    position:relative; border:0; border-radius:0; background:var(--ink); padding:2px;
    outline:2px solid var(--pixel-mid); box-shadow:2px 2px 0 var(--ink); overflow:hidden;
  }
  .bar-rage,.bar-stamina { height:10px; margin-top:4px; }

  .bossbar { top:14px; }
  .bossbar .name { color:var(--foreground); background:var(--card); border:0; outline:2px solid var(--pixel-mid); box-shadow:2px 2px 0 var(--ink); padding:6px 10px; }

function matMul3(a, b) {
  const r = new Array(9);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
    r[i * 3 + j] = a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j];
  }
  return r;
}
function hueRotateMatrix(deg) {
  const rad = (deg * Math.PI) / 180, c = Math.cos(rad), s = Math.sin(rad);
  return [
    0.213 + c * 0.787 - s * 0.213, 0.715 - c * 0.715 - s * 0.715, 0.072 - c * 0.072 + s * 0.928,
    0.213 - c * 0.213 + s * 0.143, 0.715 + c * 0.285 + s * 0.140, 0.072 - c * 0.072 - s * 0.283,
    0.213 - c * 0.213 - s * 0.787, 0.715 - c * 0.715 + s * 0.715, 0.072 + c * 0.928 + s * 0.072,
  ];
}
function saturateMatrix(sat) {
  return [
    0.213 + 0.787 * sat, 0.715 - 0.715 * sat, 0.072 - 0.072 * sat,
    0.213 - 0.213 * sat, 0.715 + 0.285 * sat, 0.072 - 0.072 * sat,
    0.213 - 0.213 * sat, 0.715 - 0.715 * sat, 0.072 + 0.928 * sat,
  ];
}
function bakeCssFilter(canvas, filterStr) {
  if (!filterStr || filterStr === "none") return canvas;
  let mat = [1, 0, 0, 0, 1, 0, 0, 0, 1], brightness = 1;
  const re = /([\w-]+)\(([-\d.]+)/g;
  let m;
  while ((m = re.exec(filterStr))) {
    const name = m[1], val = parseFloat(m[2]);
    if (name === "hue-rotate") mat = matMul3(hueRotateMatrix(val), mat);
    else if (name === "saturate") mat = matMul3(saturateMatrix(val), mat);
    else if (name === "brightness") brightness *= val;
  }
  const ctx = canvas.getContext("2d");
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] === 0) continue;
    const r = d[i], g = d[i + 1], b = d[i + 2];
    d[i]     = Math.max(0, Math.min(255, (mat[0] * r + mat[1] * g + mat[2] * b) * brightness));
    d[i + 1] = Math.max(0, Math.min(255, (mat[3] * r + mat[4] * g + mat[5] * b) * brightness));
    d[i + 2] = Math.max(0, Math.min(255, (mat[6] * r + mat[7] * g + mat[8] * b) * brightness));
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

function uniformSprite(source, name, bald = false) {
  const meta = SPRITE_META[name];

    const ox=f*meta.fw, foot=SPRITE_FOOT_X[name]?.[f] ?? meta.fw/2;
    const skins=[];
    for(let y=0;y<Math.floor(meta.fh*.55);y++) for(let x=0;x<meta.fw;x++) {
      const i=((y*canvas.width)+(ox+x))*4;
      if(sameRgb(d,i,SKIN)) skins.push([x,y]);
    }
    if(!skins.length) continue;
    const top=Math.min(...skins.map(v=>v[1]));
    const headSkins=skins.filter(v=>v[1] < top+23);
    const cx=headSkins.length ? Math.round(headSkins.reduce((a,v)=>a+v[0],0)/headSkins.length) : Math.round(foot);
    const headLeft=Math.min(...headSkins.map(v=>v[0])), headRight=Math.max(...headSkins.map(v=>v[0]));
    const neckY=Math.min(meta.fh-1,top+22);
    const hipY=neckY+33;
    for(let y=0;y<meta.fh;y++) for(let x=0;x<meta.fw;x++) {
      const i=((y*canvas.width)+(ox+x))*4;
      const clothIndex=SOURCE_CLOTH.findIndex(col=>sameRgb(d,i,col));
      if(clothIndex>=0) {
        const shade=clothIndex===0?0:clothIndex===1?1:clothIndex===2?2:3;
        
        const part = y>=hipY ? UNIFORM.pants
          : UNIFORM.vest;
        setRgb(d,i,part[shade]);
      }
      
      const paleFootwear = y>=hipY && d[i]>175 && d[i+1]>175 && d[i+2]>175
        && Math.max(d[i],d[i+1],d[i+2])-Math.min(d[i],d[i+1],d[i+2])<42;
      if(paleFootwear || (y>=hipY && sameRgb(d,i,SHOE_SOURCE))) setRgb(d,i,UNIFORM.shoe);
      if(bald && y>=top-12 && y<=top+16 && x>=headLeft-9 && x<=headRight+9 && DARKS.has(`${d[i]},${d[i+1]},${d[i+2]}`)) {
        
        setRgb(d,i,SKIN);

    for(let k=0;k<7;k++) { paint(cx-5+Math.floor(k/2),neckY+k,UNIFORM.shirt[2]); paint(cx+5-Math.floor(k/2),neckY+k,UNIFORM.shirt[2]); }

    paint(cx,neckY+14,UNIFORM.ink); paint(cx,neckY+22,UNIFORM.ink); paint(cx,neckY+30,UNIFORM.ink);
    for(let yy=neckY+11;yy<neckY+15;yy++) for(let xx=cx+5;xx<cx+11;xx++) paint(xx,yy,UNIFORM.badge);

  }

  if(name==="HURT" && meta.frames>1) c.drawImage(canvas,0,0,meta.fw,meta.fh,meta.fw,0,meta.fw,meta.fh);
  return canvas;
}

// Maps each boss kind to the custom portrait sprite key added to SPRITE_DATA.
const BOSS_FACE_SPRITE = {
  boss_enforcer: "FACE_boss_enforcer",
  boss_bruiser:  "FACE_boss_bruiser",
  boss_warden:   "FACE_boss_warden",
  boss_leader:   "FACE_boss_leader",
};
const BOSS_FACE_MARGIN = { side: 5, top: 9, bottom: 0 };

// Finds the head region in every frame of a base sprite sheet by locating the
// topmost connected blob of skin-colored pixels (so a hand/fist blob elsewhere
// in the frame is never mistaken for the head). Returns one box per frame
// (or null for frames where no head is visible, e.g. late DEATH frames).
function detectHeadBoxes(sourceImg, name) {
  const meta = SPRITE_META[name];
  const canvas = document.createElement("canvas");
  canvas.width = sourceImg.width; canvas.height = sourceImg.height;
  const c = canvas.getContext("2d");
  c.imageSmoothingEnabled = false;
  c.drawImage(sourceImg, 0, 0);
  const img = c.getImageData(0, 0, canvas.width, canvas.height);
  const d = img.data;
  const boxes = [];
  for (let f = 0; f < meta.frames; f++) {
    const ox = f * meta.fw;
    const limitY = Math.floor(meta.fh * 0.55);
    const ptSet = new Set();
    const pts = [];
    for (let y = 0; y < limitY; y++) {
      for (let x = 0; x < meta.fw; x++) {
        const i = ((y * canvas.width) + (ox + x)) * 4;
        if (sameRgb(d, i, SKIN)) { ptSet.add(y * meta.fw + x); pts.push([x, y]); }
      }
    }
    if (!pts.length) { boxes.push(null); continue; }
    const visited = new Set();
    let best = null;
    for (const [sx, sy] of pts) {
      const sk = sy * meta.fw + sx;
      if (visited.has(sk)) continue;
      const stack = [[sx, sy]];
      visited.add(sk);
      const comp = [];
      while (stack.length) {
        const [cx0, cy0] = stack.pop();
        comp.push([cx0, cy0]);
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const nx = cx0 + dx, ny = cy0 + dy;
          if (nx < 0 || ny < 0 || nx >= meta.fw || ny >= limitY) continue;
          const nk = ny * meta.fw + nx;
          if (ptSet.has(nk) && !visited.has(nk)) { visited.add(nk); stack.push([nx, ny]); }
        }
      }
      const minY = Math.min(...comp.map(p => p[1]));
      if (best === null || minY < best.minY || (minY === best.minY && comp.length > best.comp.length)) {
        best = { minY, comp };
      }
    }
    const xs = best.comp.map(p => p[0]);
    const top = best.minY;
    const headLeft = Math.min(...xs), headRight = Math.max(...xs);
    const cx = Math.round(xs.reduce((a, b) => a + b, 0) / xs.length);
    const neckY = Math.min(meta.fh - 1, top + 22);
    boxes.push({ ox, top, headLeft, headRight, cx, neckY });
  }
  return boxes;
}

// Tight opaque bounding box of a portrait image, cached on the Image itself.
function faceContentBBox(faceImg) {
  if (faceImg._bbox) return faceImg._bbox;
  const cnv = document.createElement("canvas");
  cnv.width = faceImg.width; cnv.height = faceImg.height;
  const cx = cnv.getContext("2d");
  cx.drawImage(faceImg, 0, 0);
  const data = cx.getImageData(0, 0, cnv.width, cnv.height).data;
  let minX = cnv.width, minY = cnv.height, maxX = -1, maxY = -1;
  for (let y = 0; y < cnv.height; y++) {
    for (let x = 0; x < cnv.width; x++) {
      const a = data[(y * cnv.width + x) * 4 + 3];
      if (a > 10) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  const bbox = (maxX >= minX)
    ? { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 }
    : { x: 0, y: 0, w: cnv.width, h: cnv.height };
  faceImg._bbox = bbox;
  return bbox;
}

// Erases the detected head region in each frame of a (already color-filtered)
// canvas and paints the true-color portrait into it, scaled to cover the same
// area the original head occupied (so it reads as "the same size head").
function paintBossFace(ctx, faceImg, boxes) {
  const bbox = faceContentBBox(faceImg);
  ctx.imageSmoothingEnabled = false;
  boxes.forEach(b => {
    if (!b) return;
    const bx0 = b.ox + b.headLeft - BOSS_FACE_MARGIN.side;
    const bx1 = b.ox + b.headRight + BOSS_FACE_MARGIN.side;
    const by0 = b.top - BOSS_FACE_MARGIN.top;
    const by1 = b.neckY + BOSS_FACE_MARGIN.bottom;
    const bw = bx1 - bx0, bh = by1 - by0;
    if (bw <= 0 || bh <= 0) return;
    ctx.clearRect(bx0, by0, bw, bh);
    const scale = Math.max(bw / bbox.w, bh / bbox.h);
    const dw = Math.max(1, Math.round(bbox.w * scale));
    const dh = Math.max(1, Math.round(bbox.h * scale));
    const dx = bx0 + Math.round((bw - dw) / 2);
    const dy = by0 + Math.round((bh - dh) / 2);
    ctx.drawImage(faceImg, bbox.x, bbox.y, bbox.w, bbox.h, dx, dy, dw, dh);
  });
}

class Game {

    canvas.height = GAME_H;

    this.uniformSprites = Object.fromEntries(Object.entries(sprites)
      .filter(([name]) => SPRITE_META[name])
      .map(([name, img]) => [name, uniformSprite(img, name)]));
    this.uniformSprites.RUN = sprites.PLAYER_RUN;
    this.uniformSprites.RUN_KNUCKLES = sprites.PLAYER_RUN_KNUCKLES;

    this.input = { left: false, right: false, up: false, down: false, light: false, heavy: false, block: false, roll: false };

    this.floorIndex = 0;

    this.status = "playing";
    this.clearedTimer = 0;

    this.cameraX = 0;
    this.shake = 0;
    this.hitStop = 0;
    this.flash = 0;
    this.time = 0;
    this.acc = 0;
    this.oneHitMode = false;
    this.godMode = false;
    this.last = 0;
    this.raf = 0;
    this.running = false;

    this.onHud = () => {};

  makePlayer() {
    return {
      x: 60, y: GROUND_Y, vx: 0, vy: 0, w: 16, h: 32, onGround: true, facing: 1,
      state: "idle", stateTime: 0, hp: 100, maxHp: 100, rage: 0, combo: 0,

      stamina: STAMINA_MAX, maxStamina: STAMINA_MAX, staminaRegenDelay: 0,
      weapon: "fists", durability: Infinity, maxDurability: Infinity, attackBoost: 0,
      healRemaining: 0, healTick: 0,
    };
  }

  start() {
    if (this.running) return;
    this.running = true;
    this.last = performance.now();
    const loop = (now) => {
      if (!this.running) return;
      const dt = Math.min(0.05, (now - this.last) / 1000);
      this.last = now;
      this.acc += dt;
      if (this.paused) { this.acc = 0; }
      else { while (this.acc >= FIXED_DT) { this.step(FIXED_DT); this.acc -= FIXED_DT; } }
      this.render();
      this.emitHud();
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  }

  stop() { this.running = false; cancelAnimationFrame(this.raf); }

  togglePause() {
    if (this.status !== "playing") return;
    this.paused = !this.paused;
    if (this.paused) { this.input = {}; this.prevInput = {}; }
    if (this.onPause) this.onPause(this.paused);
  }

  restart() {
    this.paused = false;
    if (this.onPause) this.onPause(false);
    this.player = this.makePlayer();
    this.enemies = []; this.particles = []; this.decals = []; this.texts = []; this.pickups = [];
    this.headGib = null;
    this.floorIndex = 0; this.status = "playing";
    this.buildFloor();
  }

  setInput(patch) { Object.assign(this.input, patch); }

  get floor() { return FLOORS[this.floorIndex]; }

  buildFloor() {
    this.waveIndex = 0; this.waveTimer = 1.4; this.bossSpawned = false; this.clearedTimer = 0;
    this.enemies = []; this.particles = []; this.decals = []; this.pickups = [];
    this.player.x = 60; this.player.state = "idle"; this.cameraX = 0;
    this.props = [];
    const kinds = ["bench", "extinguisher", "board", "doorway", "locker", "stairwell"];
    for (let x = 140; x < this.floor.length - 120; x += 74) {
      const kind = kinds[Math.floor(this.rand(x) * kinds.length)];
      this.props.push({ x, kind, broken: false });
    }
  }

  rand(seed) {
    const s = Math.sin(seed * 12.9898 + this.floorIndex * 78.233) * 43758.5453;
    return s - Math.floor(s);
  }

  ambushPoints() {
    const px = this.player.x;
    return this.props
      .filter((p) => p.kind === "locker" || p.kind === "doorway" || p.kind === "stairwell")
      .map((p) => ({ x: p.x, source: p.kind === "locker" ? "locker" : p.kind === "doorway" ? "door" : "stairwell" }))
      .filter((p) => Math.abs(p.x - px) > 60 && Math.abs(p.x - px) < 320);

    const wave = this.floor.waves[this.waveIndex];

    const points = this.ambushPoints();

      const e = makeEnemy(kind, pt.x + (i % 2 ? 14 : -14), pt.source);
      e.facing = e.x > this.player.x ? -1 : 1;
      this.enemies.push(e);
      this.burst(e.x, e.y - 14, 10, "#6d5b46", 60);
    });
    this.pushText(this.player.x + 40, 120, "AMBUSH!", "#ff6b6b");
  }

  spawnBoss() {
    this.bossSpawned = true;
    const e = makeEnemy(this.floor.boss, Math.min(this.floor.length - 90, this.player.x + 210), "door");
    this.enemies.push(e);
    this.shake = 8;
    this.pushText(e.x, 100, ENEMY_NAMES[e.kind].toUpperCase(), "#ffd166");
  }

  pressed(k) { return this.input[k] && !this.prevInput[k]; }

  step(dt) {
    this.time += dt;
    if (this.hitStop > 0) { this.hitStop -= dt; this.prevInput = { ...this.input }; return; }

    if (this.status === "playing") {
      this.updatePlayer(dt);
      this.enemies.forEach((e) => this.updateEnemy(e, dt));
      this.enemies = this.enemies.filter((e) => e.state !== "dead" || e.stateTime < DEATH_DURATION + 0.2);
      this.updateWaves(dt);
    } else if (this.status === "cleared") {
      this.clearedTimer += dt;
      if (this.clearedTimer > 2) {
        if (this.floorIndex < FLOORS.length - 1) { this.floorIndex++; this.status = "playing"; this.buildFloor(); }
        else this.status = "victory";
      }
    }

    this.updateParticles(dt);
    this.updatePickups(dt);
    this.texts.forEach((t) => { t.life -= dt; t.y -= dt * 14; });
    this.texts = this.texts.filter((t) => t.life > 0);
    this.shake = Math.max(0, this.shake - dt * 26);
    this.flash = Math.max(0, this.flash - dt * 4);

    const target = Math.max(0, Math.min(this.floor.length - GAME_W, this.player.x - GAME_W * 0.42));
    this.cameraX += (target - this.cameraX) * Math.min(1, dt * 6);
    this.prevInput = { ...this.input };
  }

  updateWaves(dt) {
    const alive = this.enemies.filter((e) => e.state !== "dead");
    if (alive.length > 0) return;
    this.waveTimer -= dt;
    if (this.waveTimer > 0) return;
    if (this.waveIndex < this.floor.waves.length) { this.spawnWave(); this.waveIndex++; this.waveTimer = 1.6; }
    else if (!this.bossSpawned) this.spawnBoss();
    else { this.status = "cleared"; this.clearedTimer = 0; }
  }

  setPlayerState(s) { this.player.state = s; this.player.stateTime = 0; this.player.attackDone = false; }

  busy() { return ["light1", "light2", "light3", "heavy", "roll", "hurt", "parry", "dead", "land", "heal"].includes(this.player.state); }

  updatePlayer(dt) {
    const p = this.player;
    p.stateTime += dt;
    p.invuln = Math.max(0, p.invuln - dt);
    p.parryWindow = Math.max(0, p.parryWindow - dt);
    p.rollCooldown = Math.max(0, p.rollCooldown - dt);
    p.heavyCooldown = Math.max(0, p.heavyCooldown - dt);
    p.comboWindow = Math.max(0, p.comboWindow - dt);
    p.attackBoost = Math.max(0, p.attackBoost - dt);
    if (p.comboWindow === 0) p.combo = 0;


    p.staminaRegenDelay = Math.max(0, p.staminaRegenDelay - dt);
    if (p.staminaRegenDelay === 0) p.stamina = Math.min(p.maxStamina, p.stamina + STAMINA_REGEN * dt);

    if (p.state === "dead") {

      if (p.headless && p.stateTime < 1.5 && Math.random() < 0.8) {
        const pulse = 90 + Math.abs(Math.sin(p.stateTime * 11)) * 200;
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.4;
        this.particles.push({
          x: p.x + p.facing * 2, y: p.y - PLAYER_DRAW_H * (0.8 - Math.min(0.45, p.stateTime * 0.5)),
          vx: Math.cos(a) * pulse * 0.6 + p.facing * 30, vy: Math.sin(a) * pulse,
          life: 0.5 + Math.random() * 0.5, maxLife: 1, size: 1 + Math.random() * 2.6,
          color: Math.random() < 0.25 ? "#ff5b5b" : "#a3141d", gravity: 520,
        });
      }
      if (p.stateTime >= DEATH_DURATION) this.status = "dead";
      return;
    }

    if (this.pressed("grab")) this.handleGrab();
    this.collectFood();

    const weapon = WEAPONS[p.weapon];

    if (!this.busy()) {
      if (this.pressed("heal") && p.rage >= SECOND_WIND_COST) {
        this.doHeal();
      } else if (this.pressed("roll") && p.rollCooldown === 0 && p.stamina >= ROLL_STAMINA_COST) {
        this.setPlayerState("roll"); p.invuln = 0.38; p.vx = 235 * p.facing; p.vy = 0; p.rollCooldown = 0.58;
        p.stamina -= ROLL_STAMINA_COST; p.staminaRegenDelay = STAMINA_REGEN_DELAY;
        this.burst(p.x, p.y - 3, 5, "#5d5550", 34);
      } else if (this.pressed("heavy") && p.heavyCooldown === 0) {
        this.setPlayerState("heavy"); p.heavyCooldown = HEAVY_COOLDOWN;
      } else if (this.pressed("light")) {
        const next = p.combo === 0 ? "light1" : p.combo === 1 ? "light2" : "light3";
        this.setPlayerState(next); p.combo = Math.min(2, p.combo + 1); p.comboWindow = 0.6;
      } else if (this.input.block) {
        if (p.state !== "block") { this.setPlayerState("block"); p.parryWindow = PARRY_WINDOW; }
      } else if (p.state === "block") this.setPlayerState("idle");
    }

    const locked = this.busy() || p.state === "block";
    if (!locked) {
      const dir = (this.input.right ? 1 : 0) - (this.input.left ? 1 : 0);
      p.vx = dir * PLAYER_SPEED;
      if (dir !== 0) { p.facing = dir; if (p.onGround) this.setStateIfChanged("run"); }
      else if (p.onGround) this.setStateIfChanged("idle");
      if (this.pressed("up") && p.onGround) { p.vy = -300; p.onGround = false; this.setPlayerState("jump"); }
    } else if (p.state !== "roll") p.vx *= 0.7;


    const hitAt = (t, dur) => p.stateTime >= t && !p.attackDone && p.stateTime < dur;
    const lightDur = 0.28 / weapon.speedMult;
    if (p.state === "light1" || p.state === "light2" || p.state === "light3") {
      const finisher = p.state === "light3";
      const baseDmg = finisher ? 17 : 11;
      const reach = finisher ? 46 : 30;
      const kb = finisher ? 150 : 90;
      if (hitAt(0.08, lightDur + 0.02)) {
        this.playerHit(baseDmg * weapon.dmgMult, kb * weapon.knockMult, false, reach);
        p.attackDone = true;
      }
      if (p.stateTime > lightDur) this.setPlayerState("idle");
    }
    if (p.state === "heavy") {
      const heavyDur = 0.5 / weapon.speedMult;
      if (hitAt(0.2, heavyDur + 0.05)) {
        this.playerHit(30 * weapon.dmgMult, 320 * weapon.knockMult, true, 40);
        p.attackDone = true;
      }
      if (p.stateTime > heavyDur) this.setPlayerState("idle");
    }
    if (p.state === "roll" && p.stateTime > 0.38) this.setPlayerState("idle");
    if (p.state === "hurt" && p.stateTime > 0.3) this.setPlayerState("idle");
    if (p.state === "parry" && p.stateTime > 0.25) this.setPlayerState("idle");
    if (p.state === "land" && p.stateTime > 0.28) this.setPlayerState("idle");


    if (p.state === "heal") {
      const rate = SECOND_WIND_HEAL / SECOND_WIND_DURATION;
      const room = Math.max(0, p.maxHp - p.hp);
      const given = Math.min(p.healRemaining, rate * dt, room);
      if (given > 0) { p.hp += given; p.healRemaining -= given; }
      p.healTick = (p.healTick || 0) + dt;
      if (p.healTick >= 0.4) {
        p.healTick = 0;
        this.pushText(p.x + (Math.random() - 0.5) * 10, p.y - 44 - Math.random() * 6, "+", "#7cff9b");
      }
      if (Math.random() < 0.6) {
        const ang = Math.random() * Math.PI * 2;
        const rad = 5 + Math.random() * 9;
        this.particles.push({
          x: p.x + Math.cos(ang) * rad, y: p.y - 6 - Math.random() * 4,
          vx: Math.cos(ang) * 6, vy: -34 - Math.random() * 26,
          life: 0.55 + Math.random() * 0.35, maxLife: 0.9, size: 1 + Math.random() * 1.6,
          color: Math.random() < 0.7 ? "#7cff9b" : "#c8ffe0", gravity: -22,
        });
      }
      if (p.stateTime > SECOND_WIND_DURATION) { p.healRemaining = 0; this.setPlayerState("idle"); }
    }

    this.physics(p, dt);
    p.x = Math.max(12, Math.min(this.floor.length - 20, p.x));
    if (p.state === "jump" && p.onGround) this.setPlayerState("land");
  }

  setStateIfChanged(s) { if (this.player.state !== s) this.setPlayerState(s); }

  physics(b, dt) {
    b.vy += GRAVITY * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y >= GROUND_Y) { b.y = GROUND_Y; b.vy = 0; b.onGround = true; b.vx *= 0.86; }
    else { b.onGround = false; b.vx *= 0.99; }
  }

  playerHit(damage, knockback, heavy, reach) {
    const p = this.player;
    reach = reach ?? (heavy ? 40 : 30);
    const boostMult = p.attackBoost > 0 ? ATTACK_BOOST_MULT : 1;
    const dealt = this.oneHitMode ? 99999 : damage * boostMult;
    const cx = p.x + p.facing * reach * 0.6;
    const knuckles = p.weapon === "knuckles";

    this.punchFX(cx, p.y - 18, p.facing, heavy || knuckles, knuckles);
    let connected = false;
    for (const e of this.enemies) {
      if (e.state === "dead") continue;
      if (Math.abs(e.x - cx) > reach || Math.abs(e.y - p.y) > 30) continue;
      connected = true;
      this.damageEnemy(e, dealt, knockback * p.facing, heavy);
    }
    if (connected) {
      this.hitStop = heavy ? 0.12 : 0.055;
      this.shake = heavy ? 7 : 2.5;
      this.flash = heavy ? 0.5 : 0.2;
      if (knuckles) {

        this.hitStop = Math.max(this.hitStop, heavy ? 0.17 : 0.1);
        this.shake = Math.max(this.shake, heavy ? 11 : 6);
        this.flash = Math.max(this.flash, heavy ? 0.7 : 0.45);
        this.knuckleImpactFX(cx, p.y - 18, p.facing);
      }
      p.rage = Math.min(100, p.rage + (heavy ? 12 : 5));
      if (p.weapon !== "fists") {
        p.durability -= 1;
        if (p.durability <= 0) this.breakWeapon();
      }
    } else this.burst(cx, p.y - 16, 3, "#4d4a55", 40);
  }

  damageEnemy(e, damage, kb, heavy) {

    if ((e.role === "blocker" || e.isBoss) && !heavy && e.state !== "stagger" && e.state !== "dead" && Math.random() < 0.45) {
      const absorbed = damage * 0.72;
      e.hp -= damage - absorbed;
      this.burst(e.x + e.facing * 8, e.y - e.h * 0.6, 6, "#cfd6ff", 60);
      this.pushText(e.x, e.y - e.h - 6, "BLOCKED", "#9fb0bd");
      e.guardFlash = 0.2;
      return;
    }
    e.hp -= damage; e.stunned = heavy ? 0.5 : 0.18; e.state = "stagger"; e.stateTime = 0;
    e.vx = kb * (e.isBoss ? 0.35 : 1);
    if (heavy && !e.isBoss) e.vy = -170;
    this.bloodBurst(e.x, e.y - e.h * 0.6, heavy ? 26 : 12);
    this.pushText(e.x, e.y - e.h - 6, `${Math.round(damage)}`, heavy ? "#ffd166" : "#ffffff");
    if (heavy) this.smashNearbyProp(e.x + Math.sign(kb) * 26);
    if (e.hp <= 0) {
      e.state = "dead"; e.stateTime = 0; e.gibbed = true;
      this.deathBurst(e);
      this.shake = Math.max(this.shake, e.isBoss ? 13 : 7);
      this.hitStop = Math.max(this.hitStop, e.isBoss ? 0.18 : 0.1);
      if (e.isBoss) this.pushText(e.x, 110, "DOWN", "#ff6b6b");
      this.maybeDropLoot(e);
    }
  }


  maybeDropLoot(e) {
    const weaponChance = e.isBoss ? 0.6 : 0.26;
    const foodChance = e.isBoss ? 0.6 : 0.15;
    if (Math.random() < weaponChance) {
      const kind = WEAPON_DROP_KINDS[Math.floor(Math.random() * WEAPON_DROP_KINDS.length)];
      this.spawnPickup(e.x - 6, kind);
    }
    if (Math.random() < foodChance) {
      const kind = FOOD_DROP_KINDS[Math.floor(Math.random() * FOOD_DROP_KINDS.length)];
      this.spawnPickup(e.x + 6, kind);
    }
  }


  equipWeapon(kind) {
    const p = this.player;
    const w = WEAPONS[kind];
    p.weapon = kind; p.durability = w.durability; p.maxDurability = w.durability;
    this.pushText(p.x, p.y - 50, w.name.toUpperCase(), "#ffd166");
    this.burst(p.x, p.y - 20, 8, w.color, 70);
  }

  breakWeapon() {
    const p = this.player;
    this.pushText(p.x, p.y - 50, "BROKEN!", "#ff6b6b");
    this.burst(p.x + p.facing * 10, p.y - 20, 10, WEAPONS[p.weapon].color, 110);
    p.weapon = "fists"; p.durability = Infinity; p.maxDurability = Infinity;
  }

  dropWeapon() {
    const p = this.player;
    if (p.weapon === "fists") return;
    this.spawnPickup(p.x + p.facing * 8, p.weapon, p.durability);
    p.weapon = "fists"; p.durability = Infinity; p.maxDurability = Infinity;
  }

  handleGrab() {
    const p = this.player;
    const near = this.pickups.find((pk) => pk.type === "weapon" && Math.abs(pk.x - p.x) < 16);
    if (near) {
      this.pickups = this.pickups.filter((pk) => pk !== near);
      if (p.weapon !== "fists") this.spawnPickup(p.x - p.facing * 8, p.weapon, p.durability);
      this.equipWeapon(near.kind);
    } else {
      this.dropWeapon();
    }
  }


  doHeal() {
    const p = this.player;
    p.rage -= SECOND_WIND_COST;
    p.healRemaining = SECOND_WIND_HEAL;
    p.invuln = Math.max(p.invuln, 0.2);
    this.setPlayerState("heal");
    this.pushText(p.x, p.y - 50, "SECOND WIND", "#7cff9b");
    this.burst(p.x, p.y - 20, 10, "#7cff9b", 70);
  }

  spawnPickup(x, kind, durability) {
    const isFood = !!FOOD_ITEMS[kind];
    this.pickups.push({
      x, y: GROUND_Y, kind, type: isFood ? "food" : "weapon",
      durability: isFood ? undefined : (durability ?? WEAPONS[kind].durability), life: 16,
    });
  }


  collectFood() {
    const p = this.player;
    const near = this.pickups.find((pk) => pk.type === "food" && Math.abs(pk.x - p.x) < 12);
    if (!near) return;
    const item = FOOD_ITEMS[near.kind];
    this.pickups = this.pickups.filter((pk) => pk !== near);
    p.hp = Math.min(p.maxHp, p.hp + item.heal);
    this.pushText(p.x, p.y - 46, `+${item.heal} HP`, "#7cff9b");
    this.burst(p.x, p.y - 18, 8, item.color, 60);
  }

  updatePickups(dt) {
    this.pickups.forEach((pk) => { pk.life -= dt; });
    this.pickups = this.pickups.filter((pk) => pk.life > 0);
  }

  smashNearbyProp(x) {
    const prop = this.props.find((p) => !p.broken && Math.abs(p.x - x) < 30 && p.kind !== "stairwell");
    if (!prop) return;
    prop.broken = true;
    this.burst(prop.x, GROUND_Y - 14, 16, "#8a5a35", 130);
  }

  updateEnemy(e, dt) {
    e.stateTime += dt; e.stunned = Math.max(0, e.stunned - dt);
    e.guardFlash = Math.max(0, e.guardFlash - dt);
    const p = this.player; const dist = p.x - e.x;

    if (e.state === "dead") { e.vx *= 0.9; this.physics(e, dt); return; }
    if (e.state === "spawn") { if (e.stateTime > 0.45) { e.state = "idle"; e.stateTime = 0; } return; }
    if (e.state === "stagger") {
      this.physics(e, dt);
      if (e.stunned === 0) { e.state = "chase"; e.stateTime = 0; }
      return;
    }
    e.facing = dist >= 0 ? 1 : -1;

    switch (e.state) {
      case "idle": if (Math.abs(dist) < e.aggroRange) e.state = "chase"; break;
      case "chase":
       
        if (e.role === "thrower" && Math.abs(dist) < e.attackRange * 0.55) {
          e.vx = -e.facing * e.speed * 0.7;
        } else if (Math.abs(dist) > e.attackRange) e.vx = e.facing * e.speed;
        else { e.vx = 0; e.state = "windup"; e.stateTime = 0; e.attackDone = false; }
        break;
      case "windup":
       
        e.vx *= 0.8;
        if (e.stateTime > (e.isBoss ? WINDUP_DURATION * 1.1 : WINDUP_DURATION)) { e.state = "attack"; e.stateTime = 0; }
        break;
      case "attack":
        if (!e.attackDone) {
          e.attackDone = true;
          if (e.kind === "firestarter") this.throwHazard(e); else this.enemyStrike(e);
        }
        if (e.stateTime > 0.22) { e.state = "recover"; e.stateTime = 0; }
        break;
      case "recover":
        e.vx *= 0.85;
        if (e.stateTime > (e.isBoss ? 0.35 : 0.6)) e.state = "chase";
        break;
    }
    this.physics(e, dt);
    e.x = Math.max(10, Math.min(this.floor.length - 14, e.x));
  }

  throwHazard(e) {
    for (let i = 0; i < 14; i++) {
      this.particles.push({
        x: e.x + e.facing * 8, y: e.y - 18,
        vx: e.facing * (120 + Math.random() * 60), vy: -60 + Math.random() * 40,
        life: 0.8, maxLife: 0.8, size: 2, color: "#7cff9b", gravity: 260,
      });
    }
    if (Math.abs(this.player.x - e.x) < 100) this.hitPlayer(e.damage, e.facing);
  }

  enemyStrike(e) {
    const p = this.player;
    if (Math.abs(p.x - e.x) > e.attackRange + 10 || Math.abs(p.y - e.y) > 32) return;
    this.hitPlayer(e.damage, e.facing, e);
  }

  hitPlayer(damage, dir, source) {
    const p = this.player;
    if (this.godMode) return;
    if (p.invuln > 0 || p.state === "dead") return;
    const facingAttack = p.facing === -Math.sign(dir);
    if (p.state === "block" && facingAttack) {
      if (p.parryWindow > 0) {
        this.hitStop = 0.14; this.shake = 5; this.flash = 0.7;
        this.pushText(p.x, p.y - 44, "PARRY!", "#8ff0c4");
        p.rage = Math.min(100, p.rage + 20);
        p.attackBoost = ATTACK_BOOST_DURATION;
        this.parryFX(p.x, p.y - 30);
        if (source) { source.state = "stagger"; source.stunned = 0.9; source.vx = 120 * dir; }
        this.setPlayerState("parry");
        return;
      }
      p.hp -= damage * 0.25; this.shake = 2;
      this.burst(p.x + p.facing * 10, p.y - 18, 6, "#cfd6ff", 70);
    } else {
      p.hp -= damage; p.invuln = 0.5; p.vx = 130 * dir;
      this.setPlayerState("hurt");
      this.bloodBurst(p.x, p.y - 18, 16);
      this.hitStop = 0.07; this.shake = 5; this.flash = 0.6;
    }
    if (p.hp <= 0 && p.state !== "dead") { p.hp = 0; this.setPlayerState("dead"); this.playerDeathFX(dir || p.facing); }
  }

  burst(x, y, n, color, speed) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      this.particles.push({
        x, y, vx: Math.cos(a) * speed * Math.random(), vy: Math.sin(a) * speed * Math.random() - 40,
        life: 0.5 + Math.random() * 0.4, maxLife: 0.9, size: 1 + Math.random() * 2, color, gravity: 420,
      });
    }
  }

  bloodBurst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.6;
      const sp = 60 + Math.random() * 200;
      this.particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.45 + Math.random() * 0.5, maxLife: 0.95, size: 1 + Math.random() * 2.4,
        color: Math.random() < 0.25 ? "#ff5b5b" : "#a3141d", gravity: 520,
      });
    }
  }

  deathBurst(e) {
    const amount = e.isBoss ? 105 : 68;
    this.bloodBurst(e.x, e.y - e.h * 0.58, amount);
    for (let i = 0; i < (e.isBoss ? 18 : 11); i++) {
      const dir = Math.random() < 0.5 ? -1 : 1;
      this.particles.push({
        x: e.x, y: e.y - 12 - Math.random() * e.h * 0.7,
        vx: dir * (75 + Math.random() * 185), vy: -95 - Math.random() * 210,
        life: 0.75 + Math.random() * 0.65, maxLife: 1.4,
        size: 3 + Math.random() * (e.isBoss ? 6 : 4), color: Math.random() < 0.3 ? "#3b070b" : "#761018",
        gravity: 540, chunk: true, spin: (Math.random() - 0.5) * 14, angle: Math.random() * Math.PI,
      });
    }
    for (let i = 0; i < 14; i++) this.addDecal(e.x - 34 + Math.random() * 68, 84 + Math.random() * 114, 1 + Math.random() * 4, true);
  }

  
  playerDeathFX(dir) {
    const p = this.player;
    const d = Math.sign(dir) || 1;
    const nx = p.x, ny = p.y - PLAYER_DRAW_H * 0.82;
    this.hitStop = 0.5; this.shake = 16; this.flash = 1;
    p.headless = true;
   
    this.bloodBurst(nx, ny, 46);
    for (let i = 0; i < 22; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.9;
      const sp = 120 + Math.random() * 280;
      this.particles.push({
        x: nx, y: ny, vx: Math.cos(a) * sp + d * 40, vy: Math.sin(a) * sp,
        life: 0.7 + Math.random() * 0.7, maxLife: 1.4, size: 2 + Math.random() * 4,
        color: Math.random() < 0.3 ? "#3b070b" : "#761018", gravity: 560,
        chunk: true, spin: (Math.random() - 0.5) * 16, angle: Math.random() * Math.PI,
      });
    }
    this.particles.push({ x: nx, y: ny, vx: 0, vy: 0, gravity: 0, ring: true, radius: 3, grow: 210, life: 0.3, maxLife: 0.3, color: "#ff5b5b", width: 3 });
    this.particles.push({ x: nx, y: ny, vx: 0, vy: 0, gravity: 0, ring: true, radius: 8, grow: 120, life: 0.42, maxLife: 0.42, color: "#761018", width: 2 });
    for (let i = 0; i < 18; i++) this.addDecal(p.x - 40 + Math.random() * 80, GROUND_Y + 1, 2 + Math.random() * 5, false);
    
    this.headGib = {
      x: nx, y: ny, vx: d * (110 + Math.random() * 90), vy: -330 - Math.random() * 90,
      angle: 0, spin: (Math.random() < 0.5 ? -1 : 1) * (9 + Math.random() * 6), life: 3.2, bounced: 0,
    };
  }

  updateHeadGib(dt) {
    const h = this.headGib;
    if (!h) return;
    h.vy += 620 * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.angle += h.spin * dt; h.life -= dt;
    if (h.y >= GROUND_Y - 3) {
      h.y = GROUND_Y - 3;
      if (h.bounced < 2 && Math.abs(h.vy) > 60) {
        h.vy *= -0.42; h.vx *= 0.6; h.spin *= 0.5; h.bounced++;
        this.bloodBurst(h.x, h.y, 8);
        this.addDecal(h.x, GROUND_Y + 1, 5, false);
      } else { h.vy = 0; h.vx *= 0.82; h.spin *= 0.8; }
    }
    if (h.life > 0 && Math.random() < 0.6) {
      this.particles.push({
        x: h.x, y: h.y, vx: (Math.random() - 0.5) * 40, vy: 20 + Math.random() * 40,
        life: 0.4, maxLife: 0.5, size: 1 + Math.random() * 2, color: "#a3141d", gravity: 480,
      });
    }
    if (h.life <= 0) { this.addDecal(h.x, GROUND_Y + 1, 6, false); this.headGib = null; }
  }

  drawHeadGib() {
    const h = this.headGib;
    if (!h) return;
    const ctx = this.ctx;
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(h.angle);
    ctx.fillStyle = "#c79a74";
    ctx.fillRect(-4, -5, 8, 9);
    ctx.fillStyle = "#3a2a22";
    ctx.fillRect(-4, -5, 8, 3);
    ctx.fillStyle = "#1b1210";
    ctx.fillRect(-3, 0, 2, 2); ctx.fillRect(1, 0, 2, 2);
    ctx.fillStyle = "#761018";
    ctx.fillRect(-4, 3, 8, 2);
    ctx.restore();
  }

  addDecal(x, y, size, onWall) {
    if (this.decals.length > 900) this.decals.shift();
    this.decals.push({ x, y, r: size, a: 0.35 + Math.random() * 0.4, onWall });
  }

  pushText(x, y, text, color) { this.texts.push({ x, y, text, color, life: 0.9 }); }

  updateParticles(dt) {
    this.updateHeadGib(dt);
    for (const q of this.particles) {
      q.vy += q.gravity * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;
      if (q.chunk) q.angle += q.spin * dt;
      if (q.ring) { q.radius += q.grow * dt; continue; }
      if (q.streak) { q.x += q.vx * dt; continue; }
      if (q.y >= GROUND_Y && q.color !== "#7cff9b") { this.addDecal(q.x, GROUND_Y + 1, q.size * (q.chunk ? 2.2 : 1.4), false); q.life = 0; }
      if (q.y < 118 && q.color !== "#7cff9b" && Math.random() < 0.04) { this.addDecal(q.x, q.y, q.size, true); q.life = 0; }
    }
    this.particles = this.particles.filter((q) => q.life > 0);
  }


  parryFX(x, y) {
    const P = this.particles;
    P.push({ x, y, vx: 0, vy: 0, gravity: 0, ring: true, radius: 4, grow: 150, life: 0.32, maxLife: 0.32, color: "#8ff0c4", width: 3 });
    P.push({ x, y, vx: 0, vy: 0, gravity: 0, ring: true, radius: 2, grow: 95, life: 0.45, maxLife: 0.45, color: "#ffd166", width: 2 });
    P.push({ x, y, vx: 0, vy: 0, gravity: 0, ring: true, radius: 10, grow: 60, life: 0.25, maxLife: 0.25, color: "#ffffff", width: 1.5 });

    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 80 + Math.random() * 130;
      P.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, gravity: 60,
        life: 0.3 + Math.random() * 0.3, maxLife: 0.6, size: 1 + Math.random() * 1.5,
        color: Math.random() < 0.5 ? "#ffd166" : "#8ff0c4" });
    }
  }


  punchFX(x, y, dir, heavy, gold = false) {
    const streakColor = gold ? "rgba(255,213,120,0.9)" : "rgba(255,255,255,0.85)";
    const gustColor = gold ? "rgba(255,213,120,0.55)" : "rgba(255,255,255,0.5)";
    const n = heavy ? 5 : 3;
    for (let i = 0; i < n; i++) {
      const a = dir === 1 ? (Math.random() - 0.5) * 0.5 : Math.PI + (Math.random() - 0.5) * 0.5;
      this.particles.push({
        x: x - dir * 4, y: y + (Math.random() - 0.5) * 10,
        vx: dir * (50 + Math.random() * 50), vy: 0, gravity: 0, streak: true,
        angle: a, len: (heavy ? 14 : 9) + Math.random() * 5,
        life: heavy ? 0.14 : 0.1, maxLife: 0.14,
        color: streakColor, width: 1,
      });
    }
    if (heavy) {
      
      this.particles.push({
        x, y, vx: 0, vy: 0, gravity: 0, ring: true, radius: 8, grow: 110,
        life: 0.18, maxLife: 0.18, color: gustColor, width: 1.5,
      });
    }
  }


  knuckleImpactFX(x, y, dir) {
    const P = this.particles;
    P.push({ x, y, vx: 0, vy: 0, gravity: 0, ring: true, radius: 3, grow: 190, life: 0.22, maxLife: 0.22, color: "#ffe08a", width: 3 });
    P.push({ x, y, vx: 0, vy: 0, gravity: 0, ring: true, radius: 6, grow: 110, life: 0.3, maxLife: 0.3, color: "#e0b34d", width: 2 });
    for (let i = 0; i < 10; i++) {
      const a = (dir === 1 ? 0 : Math.PI) + (Math.random() - 0.5) * 1.3;
      const sp = 90 + Math.random() * 140;
      P.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.5 - 20, gravity: 140,
        life: 0.22 + Math.random() * 0.22, maxLife: 0.4, size: 1 + Math.random() * 1.6,
        color: Math.random() < 0.6 ? "#ffe08a" : "#fff3d0",
      });
    }
  }


  drawSpriteFrame(name, progress, x, y, drawH, facing, flipTint, excludeBoxes) {
    const img = this.uniformSprites[name];
    const meta = name === "RUN_KNUCKLES" ? PLAYER_RUN_KNUCKLES_META : name === "RUN" ? PLAYER_RUN_META : SPRITE_META[name];
    if (!img || !meta) return null;
    let idx = Math.floor(progress * meta.frames);
    idx = meta.loop ? ((idx % meta.frames) + meta.frames) % meta.frames : Math.min(meta.frames - 1, Math.max(0, idx));
    const scale = drawH / meta.fh;
    const drawW = meta.fw * scale;

    const anchors = SPRITE_FOOT_X[name];
    const footAnchor = (name === "RUN" || name === "RUN_KNUCKLES") ? meta.fw / 2 : (anchors?.[idx] ?? meta.fw / 2);
    const anchoredX = x - facing * (footAnchor - meta.fw / 2) * scale;
    const anchoredY = y;
    const ctx = this.ctx;
    ctx.save();
    ctx.translate(Math.round(anchoredX), Math.round(anchoredY));
    if (facing === -1) ctx.scale(-1, 1);
    if (flipTint) { ctx.filter = flipTint; }
    const box = excludeBoxes && excludeBoxes[idx];
    if (box) {
     
      ctx.beginPath();
      ctx.rect(-drawW / 2, -drawH, drawW, drawH);
      ctx.rect(-drawW / 2 + box[0] * scale, -drawH + box[1] * scale, (box[2] - box[0]) * scale, (box[3] - box[1]) * scale);
      ctx.clip("evenodd");
    }
    ctx.drawImage(img, idx * meta.fw, 0, meta.fw, meta.fh, Math.round(-drawW / 2), Math.round(-drawH), Math.round(drawW), Math.round(drawH));
    ctx.restore();
    if (!box) return { idx, scale, drawW, drawH, anchoredX, anchoredY };
    const neckX = box[4] !== undefined ? box[4] : (box[0] + box[2]) / 2;
    const neckY = box[5] !== undefined ? box[5] : box[3];
    const localX = -drawW / 2 + neckX * scale;
    const localY = -drawH + neckY * scale;
    return {
      idx, scale, drawW, drawH, anchoredX, anchoredY,
      neckScreenX: anchoredX + facing * localX,
      neckScreenY: anchoredY + localY,
    };
  }

  render() {
    const ctx = this.ctx;
    const pal = this.floor.palette;
    const sx = (Math.random() - 0.5) * this.shake;
    const sy = (Math.random() - 0.5) * this.shake;

    ctx.save();
    ctx.translate(Math.round(-this.cameraX + sx), Math.round(sy));

    
    ctx.fillStyle = pal.wall;
    ctx.fillRect(this.cameraX - 10, 0, GAME_W + 20, GAME_H);
    ctx.fillStyle = this.hexAlpha(pal.trim, 0.34); ctx.fillRect(this.cameraX - 10, 0, GAME_W + 20, 25);
    ctx.fillStyle = this.hexAlpha(pal.light, 0.42);
    for (let x = Math.floor(this.cameraX / 118) * 118; x < this.cameraX + GAME_W + 118; x += 118) ctx.fillRect(x + 24, 10, 64, 4);
    ctx.fillStyle = this.hexAlpha(pal.trim, 0.24);
    for (let y = 42; y < GROUND_Y; y += 18) ctx.fillRect(this.cameraX - 10, y, GAME_W + 20, 1);
    for (let x = Math.floor(this.cameraX / 36) * 36; x < this.cameraX + GAME_W + 36; x += 36) ctx.fillRect(x, 42, 1, GROUND_Y - 42);
    ctx.fillStyle = pal.trim; ctx.fillRect(this.cameraX - 10, 151, GAME_W + 20, 3);
    ctx.fillStyle = this.hexAlpha(pal.light, 0.7); ctx.font = "6px monospace"; ctx.textAlign = "left";
    for (let x = Math.floor(this.cameraX / 240) * 240; x < this.cameraX + GAME_W + 240; x += 240) ctx.fillText(`ROOM ${101 + Math.floor(x / 240) % 30}`, x + 8, 142);

    this.props.forEach((p) => this.drawProp(p, pal));

    this.decals.filter((d) => d.onWall).forEach((d) => {
      ctx.fillStyle = `rgba(120,16,22,${d.a})`; ctx.fillRect(Math.round(d.x), Math.round(d.y), d.r, d.r);
    });

    ctx.fillStyle = pal.floor;
    ctx.fillRect(this.cameraX - 10, GROUND_Y, GAME_W + 20, GAME_H - GROUND_Y);
    ctx.fillStyle = "rgba(255,255,255,0.07)";
    for (let y = GROUND_Y + 10; y < GAME_H; y += 12) ctx.fillRect(this.cameraX - 10, y, GAME_W + 20, 1);
    for (let x = Math.floor(this.cameraX / 28) * 28; x < this.cameraX + GAME_W + 28; x += 28) ctx.fillRect(x, GROUND_Y, 1, GAME_H - GROUND_Y);

    this.decals.filter((d) => !d.onWall).forEach((d) => {
      ctx.fillStyle = `rgba(122,14,20,${d.a})`; ctx.fillRect(Math.round(d.x), Math.round(d.y), d.r * 1.6, d.r);
    });

    this.pickups.forEach((pk) => this.drawPickup(pk));
    this.enemies.forEach((e) => this.drawEnemy(e));
    this.drawPlayer();
    this.drawHeadGib();

    this.particles.forEach((q) => {
      if (q.ring) {
        ctx.globalAlpha = Math.max(0, q.life / q.maxLife);
        ctx.strokeStyle = q.color;
        ctx.lineWidth = q.width;
        ctx.beginPath();
        ctx.arc(q.x, q.y, q.radius, 0, Math.PI * 2);
        ctx.stroke();
        return;
      }
      if (q.streak) {
       
        const t = q.life / q.maxLife;
        ctx.globalAlpha = t;
        ctx.strokeStyle = q.color;
        ctx.lineWidth = q.width;
        const half = q.len * t * 0.5;
        const c = Math.cos(q.angle), s = Math.sin(q.angle);
        ctx.beginPath();
        ctx.moveTo(q.x - c * half, q.y - s * half);
        ctx.lineTo(q.x + c * half, q.y + s * half);
        ctx.stroke();
        return;
      }
      ctx.globalAlpha = Math.max(0, q.life / q.maxLife);
      ctx.fillStyle = q.color;
      if (q.chunk) {
        ctx.save(); ctx.translate(Math.round(q.x), Math.round(q.y)); ctx.rotate(q.angle);
        ctx.fillRect(-q.size, -q.size * 0.55, q.size * 2, q.size * 1.1); ctx.restore();
      } else ctx.fillRect(Math.round(q.x), Math.round(q.y), q.size, q.size);
    });
    ctx.globalAlpha = 1;

    ctx.font = "8px monospace"; ctx.textAlign = "center";
    this.texts.forEach((t) => { ctx.globalAlpha = Math.min(1, t.life); ctx.fillStyle = t.color; ctx.fillText(t.text, Math.round(t.x), Math.round(t.y)); });
    ctx.globalAlpha = 1;

    const grad = ctx.createLinearGradient(0, 0, 0, GAME_H);
    grad.addColorStop(0, pal.haze); grad.addColorStop(0.55, "rgba(54,44,47,1)"); grad.addColorStop(1, pal.haze);
    ctx.globalCompositeOperation = "multiply";
    ctx.globalAlpha = 0.48;
    ctx.fillStyle = grad; ctx.fillRect(this.cameraX - 10, 0, GAME_W + 20, GAME_H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "lighter";
    this.props.forEach((p) => {
      if (p.kind !== "doorway" && p.kind !== "stairwell") return;
      const flicker = 0.82 + Math.sin(this.time * 6 + p.x) * 0.06;
      const g = ctx.createRadialGradient(p.x + 8, 176, 4, p.x + 8, 176, 88);
      g.addColorStop(0, this.hexAlpha(pal.light, 0.22 * flicker)); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.fillRect(p.x - 82, 90, 180, GAME_H - 90);
    });
    ctx.globalCompositeOperation = "source-over";
    ctx.restore();

    const vg = ctx.createRadialGradient(GAME_W / 2, GAME_H / 2, 60, GAME_W / 2, GAME_H / 2, 260);
    vg.addColorStop(0, "rgba(0,0,0,0.04)"); vg.addColorStop(1, "rgba(0,0,0,0.48)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, GAME_W, GAME_H);
    if (this.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${this.flash * 0.16})`; ctx.fillRect(0, 0, GAME_W, GAME_H); }
    if (this.paused) this.overlay("PAUSED", "Press P or tap PAUSE to resume");
    if (this.status === "dead") this.overlay("YOU BLED OUT", "Press R to try again");
    if (this.status === "cleared") this.overlay("FLOOR CLEARED", "Ascending...");
    if (this.status === "victory") this.overlay("Balo Defeated", "Press R to run it again");
  }

  hexAlpha(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }

  overlay(title, sub) {
    const ctx = this.ctx;
    ctx.fillStyle = "rgba(8,7,6,0.82)"; ctx.fillRect(0, 0, GAME_W, GAME_H);
    ctx.fillStyle = "#080706"; ctx.fillRect(GAME_W / 2 - 128, GAME_H / 2 - 38, 256, 76);
    ctx.fillStyle = "#443a29"; ctx.fillRect(GAME_W / 2 - 126, GAME_H / 2 - 36, 252, 72);
    ctx.fillStyle = "#17130f"; ctx.fillRect(GAME_W / 2 - 122, GAME_H / 2 - 32, 244, 64);
    ctx.fillStyle = "#a99162"; ctx.fillRect(GAME_W / 2 - 118, GAME_H / 2 - 28, 236, 2);
    ctx.textAlign = "center";
    ctx.fillStyle = "#e3aa36"; ctx.font = '12px "Press Start 2P", monospace'; ctx.fillText(title.toUpperCase(), GAME_W / 2, GAME_H / 2 - 4);
    ctx.fillStyle = "#f2dfb3"; ctx.font = '6px "Press Start 2P", monospace'; ctx.fillText(sub.toUpperCase(), GAME_W / 2, GAME_H / 2 + 15);
  }

  drawProp(p, pal) {
    const ctx = this.ctx;
    if (p.x < this.cameraX - 60 || p.x > this.cameraX + GAME_W + 60) return;
    const y = GROUND_Y;
    switch (p.kind) {
      case "bench":
        ctx.fillStyle = p.broken ? "#4a3324" : "#6b4a2f";
        if (p.broken) ctx.fillRect(p.x, y - 4, 26, 4);
        else { ctx.fillRect(p.x, y - 12, 30, 4); ctx.fillRect(p.x + 2, y - 8, 3, 8); ctx.fillRect(p.x + 25, y - 8, 3, 8); }
        break;
      case "extinguisher":
        ctx.fillStyle = "#8f1f22"; ctx.fillRect(p.x, y - 46, 5, 12);
        ctx.fillStyle = "#2b2b2b"; ctx.fillRect(p.x + 1, y - 49, 3, 3);
        break;
      case "board":
        ctx.fillStyle = "#3f3226"; ctx.fillRect(p.x, y - 74, 40, 26);
        ctx.fillStyle = "#cbbfa5";
        for (let i = 0; i < 5; i++) ctx.fillRect(p.x + 4 + (i % 3) * 12, y - 70 + Math.floor(i / 3) * 12, 8, 8);
        break;
      case "doorway":
        ctx.fillStyle = "#120e14"; ctx.fillRect(p.x, y - 58, 22, 58);
        ctx.fillStyle = p.broken ? "#3a2717" : "#5b3d24"; ctx.fillRect(p.x + (p.broken ? 16 : 0), y - 58, p.broken ? 6 : 4, 58);
        ctx.fillStyle = pal.light; ctx.globalAlpha = 0.5; ctx.fillRect(p.x + 5, y - 54, 12, 50); ctx.globalAlpha = 1;
        break;
      case "locker":
        ctx.fillStyle = "#2f4a52"; ctx.fillRect(p.x, y - 52, 26, 52);
        ctx.fillStyle = "#24393f"; ctx.fillRect(p.x + 13, y - 52, 1, 52);
        ctx.fillStyle = "#8fa8ad"; ctx.fillRect(p.x + 9, y - 30, 2, 2); ctx.fillRect(p.x + 16, y - 30, 2, 2);
        break;
      case "stairwell":
        ctx.fillStyle = "#171320"; ctx.fillRect(p.x, y - 66, 34, 66);
        ctx.fillStyle = pal.trim;
        for (let i = 0; i < 6; i++) ctx.fillRect(p.x + 2 + i * 5, y - 8 - i * 9, 6, 3);
        break;
    }
  }

  drawPlayer() {
    const p = this.player;
    const ctx = this.ctx;
    const weapon = WEAPONS[p.weapon];
    const flick = p.invuln > 0 && Math.floor(this.time * 30) % 2 === 0;
    if (flick) ctx.globalAlpha = 0.5;

    const feetX = p.x, feetY = p.y;
    let spriteName = "IDLE", duration = 1, playedTime = p.stateTime, tint = null;

    switch (p.state) {
      case "idle": spriteName = "IDLE"; duration = SPRITE_META.IDLE.frames / SPRITE_META.IDLE.fps; break;
      case "run": spriteName = "RUN"; duration = p.weapon === "knuckles" ? PLAYER_RUN_KNUCKLES_META.frames / PLAYER_RUN_KNUCKLES_META.fps : PLAYER_RUN_META.frames / PLAYER_RUN_META.fps; break;
      case "jump": spriteName = "JUMP"; duration = SPRITE_META.JUMP.frames / SPRITE_META.JUMP.fps; break;
      case "land": spriteName = "LAND"; duration = SPRITE_META.LAND.frames / SPRITE_META.LAND.fps; break;
      case "light1": case "light2": case "light3":
        spriteName = "LIGHT"; duration = 0.28 / weapon.speedMult;
        if (p.state === "light3") tint = "brightness(1.35) saturate(1.4)";
        break;
      case "heavy": spriteName = "HEAVY"; duration = 0.5 / weapon.speedMult; tint = "brightness(1.2) saturate(1.3)"; break;
      case "hurt": spriteName = "HURT"; duration = 0.3; break;
      case "dead": spriteName = "DEATH"; duration = DEATH_DURATION; break;
      case "roll": spriteName = "LAND"; duration = 0.38; break;
      case "block": spriteName = "BLOCK"; duration = 0.36; break;
      case "parry": spriteName = "BLOCK"; duration = 0.36; tint = "brightness(1.18) saturate(1.15)"; break;
      case "heal": spriteName = "IDLE"; duration = SPRITE_META.IDLE.frames / SPRITE_META.IDLE.fps; break;
      default: spriteName = "IDLE"; duration = 1;
    }

    const meta = spriteName === "RUN" ? PLAYER_RUN_META : SPRITE_META[spriteName];
    let progress = meta.loop ? (playedTime % duration) / duration : Math.min(0.999, playedTime / duration);
    if (p.state === "roll") progress = Math.min(0.999, (playedTime * 3) / duration);


    if (p.attackBoost > 0) {
      this.drawPlayerLight(spriteName, progress, feetX, feetY, p.facing, "#ffd166", 1);
      this.drawAttackBoostWisps(feetX, feetY, p.facing);
    }

    let secondWindFade = 0;
    if (p.state === "heal") {
      const t = Math.min(1, p.stateTime / SECOND_WIND_DURATION);
      secondWindFade = t > 0.85 ? Math.max(0, (1 - t) / 0.15) : 1;
      this.drawPlayerLight(spriteName, progress, feetX, feetY, p.facing, "#9dffd0", secondWindFade * 0.9);
      this.drawSecondWindGusts(feetX, feetY, secondWindFade, false);
    }


    if (p.state === "roll") {
      const t = Math.min(0.999, p.stateTime / 0.38);
      ctx.globalAlpha = 0.12;
      this.drawSpriteFrame("LAND", t, feetX - p.facing * 9, feetY, PLAYER_DRAW_H, p.facing, null);
      ctx.globalAlpha = flick ? 0.5 : 1;
      this.drawSpriteFrame("LAND", t, feetX, feetY, PLAYER_DRAW_H, p.facing, null);
    } else {
      const beheaded = p.state === "dead" && p.headless;
      if (beheaded) {
  
        const info = this.drawSpriteFrame(spriteName, progress, feetX, feetY, PLAYER_DRAW_H, p.facing, tint, DEATH_HEAD_BOX);
        if (info && info.neckScreenX !== undefined) {
          const nx = Math.round(info.neckScreenX), ny = Math.round(info.neckScreenY);
          ctx.fillStyle = "#761018";
          ctx.fillRect(nx - 4, ny - 2, 8, 3);
          ctx.fillStyle = "#ff5b5b";
          ctx.fillRect(nx - 2, ny - 2, 4, 1);
        }
      } else {
       
        const heldSpriteName = (p.weapon === "knuckles" && (spriteName === "IDLE" || spriteName === "LIGHT" || spriteName === "RUN"))
          ? spriteName + "_KNUCKLES" : spriteName;
        this.drawSpriteFrame(heldSpriteName, progress, feetX, feetY, PLAYER_DRAW_H, p.facing, tint);
      }
      if (p.state === "parry") {
        
        const t = Math.min(1, p.stateTime / 0.36);
        const cx = feetX + p.facing * 13;
        const cy = feetY - 34;
        const rad = 15 + t * 9;
        const fade = 1 - t * 0.75;
        ctx.save();
        ctx.globalAlpha = fade;
        ctx.shadowColor = "#8ff0c4";
        ctx.shadowBlur = 10;
        ctx.strokeStyle = "#8ff0c4";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        if (p.facing === 1) ctx.arc(cx, cy, rad, -Math.PI * 0.38, Math.PI * 0.38);
        else ctx.arc(cx, cy, rad, Math.PI * 0.62, Math.PI * 1.38);
        ctx.stroke();
        ctx.strokeStyle = "#eafff4";
        ctx.lineWidth = 1;
        ctx.globalAlpha = fade * 0.9;
        ctx.beginPath();
        if (p.facing === 1) ctx.arc(cx, cy, rad, -Math.PI * 0.3, Math.PI * 0.3);
        else ctx.arc(cx, cy, rad, Math.PI * 0.7, Math.PI * 1.3);
        ctx.stroke();
        ctx.restore();
      }
    }

    this.drawHeldWeapon(spriteName, progress);
    if (secondWindFade > 0) this.drawSecondWindGusts(feetX, feetY, secondWindFade, true);

    ctx.globalAlpha = 1;
  }


  drawPlayerLight(spriteName, progress, x, y, facing, color, alpha = 1) {
    const ctx = this.ctx;
    const pulse = 0.82 + Math.sin(this.time * 13) * 0.12;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = alpha * pulse * 0.42;
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;
    this.drawSpriteFrame(spriteName, progress, x, y, PLAYER_DRAW_H, facing,
      `drop-shadow(0 0 5px ${color}) brightness(1.45) saturate(1.08)`);
    ctx.globalAlpha = alpha * 0.2;
    ctx.shadowBlur = 26;
    this.drawSpriteFrame(spriteName, progress, x, y, PLAYER_DRAW_H, facing,
      `drop-shadow(0 0 11px ${color}) brightness(1.25)`);
    ctx.restore();
  }


  drawAttackBoostWisps(x, y, facing) {
    const ctx = this.ctx;
    const rise = (this.time * 42) % 18;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = "#ffd166";
    ctx.shadowColor = "#ffb52e";
    ctx.shadowBlur = 8;
    ctx.lineCap = "round";
    for (let i = 0; i < 8; i++) {
      const side = i % 2 ? 1 : -1;
      const yy = y - 4 - ((i * 10 + rise) % 64);
      const xx = x + side * (11 + (i % 3) * 3);
      const sway = Math.sin(this.time * 8 + i * 1.7) * 3;
      ctx.globalAlpha = 0.32 + (i % 3) * 0.16;
      ctx.lineWidth = i % 3 === 0 ? 2 : 1;
      ctx.beginPath();
      ctx.moveTo(xx, yy + 8);
      ctx.bezierCurveTo(xx + side * 4, yy + 4, xx - side * 2 + sway, yy, xx + side + sway, yy - 7);
      ctx.stroke();
    }
    ctx.restore();
  }


  drawSecondWindGusts(x, y, alpha, front) {
    const ctx = this.ctx;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.shadowColor = "#a8ffe0";
    ctx.shadowBlur = front ? 5 : 8;
    const bands = 7;
    for (let i = 0; i < bands; i++) {
      const height = i / (bands - 1);
      const phase = this.time * 6.2 + i * 1.42;
      const shift = Math.round(Math.sin(phase) * (4 + height * 5));
      const halfWidth = Math.round(9 + height * 14);
      const yy = Math.round(y - 4 - i * 8 + Math.sin(phase * 0.65) * 1.5);
      const bright = i % 3 === 1;
      ctx.fillStyle = bright ? "#dffff2" : "#8ff0c4";
      ctx.globalAlpha = alpha * (front ? 0.58 : 0.25) * (bright ? 1 : 0.8);


      const leftLen = Math.max(4, halfWidth - 7 + ((i + (front ? 1 : 0)) % 4));
      const rightLen = Math.max(4, halfWidth - 9 + ((i + (front ? 3 : 1)) % 5));
      const thickness = bright && front ? 2 : 1;
      const frontOffset = front ? Math.round(Math.cos(phase) * 3) : -Math.round(Math.cos(phase) * 2);
      ctx.fillRect(Math.round(x - halfWidth + shift + frontOffset), yy, leftLen, thickness);
      ctx.fillRect(Math.round(x + halfWidth - rightLen + shift + frontOffset), yy + (i % 2), rightLen, thickness);


      const leadRight = Math.cos(phase) > 0;
      const tipX = Math.round(x + shift + (leadRight ? halfWidth : -halfWidth));
      ctx.globalAlpha *= 0.72;
      ctx.fillRect(tipX + (leadRight ? 2 : -5), yy - 2, 4, 1);
      if (i > 1 && i % 2 === 0) ctx.fillRect(tipX + (leadRight ? 5 : -8), yy - 4, 3, 1);
    }

 
    ctx.fillStyle = front ? "#eafff6" : "#76ddb0";
    for (let i = 0; i < 4; i++) {
      const travel = (this.time * 24 + i * 17) % 58;
      const yy = Math.round(y - 3 - travel);
      const spread = 8 + travel * 0.2;
      const xx = Math.round(x + Math.sin(this.time * 5 + i * 2.1) * spread);
      ctx.globalAlpha = alpha * (front ? 0.34 : 0.16);
      ctx.fillRect(xx, yy, i % 2 ? 2 : 1, i % 2 ? 2 : 1);
    }
    ctx.restore();
  }


  drawBrassKnuckle(x, y, angle = 0, scale = 1) {
    const ctx = this.ctx;
    ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(angle); ctx.scale(scale, scale);
    ctx.strokeStyle = "#21170d"; ctx.fillStyle = "#b77a25"; ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(-7,-3); ctx.quadraticCurveTo(-5,-8,-1,-7); ctx.quadraticCurveTo(2,-10,6,-7);
    ctx.quadraticCurveTo(10,-9,13,-5); ctx.lineTo(13,1); ctx.quadraticCurveTo(10,3,8,5);
    ctx.lineTo(3,9); ctx.quadraticCurveTo(0,11,-2,7); ctx.lineTo(-7,4); ctx.closePath(); ctx.fill(); ctx.stroke();
    for (const cx of [-4,1,6,11]) {
      ctx.fillStyle = "#130e09"; ctx.beginPath(); ctx.arc(cx,-3,2.6,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "#f2c967"; ctx.fillRect(cx-1.3,-5,2.4,1);
    }
    ctx.strokeStyle = "#edbd59"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-6,2); ctx.lineTo(-1,6); ctx.lineTo(8,2); ctx.stroke();
    ctx.restore();
  }


  drawHeldWeapon(spriteName, progress) {
    const p = this.player;
    if (p.weapon === "fists" || p.state === "dead" || p.state === "roll") return;
    const ctx = this.ctx;
    const w = WEAPONS[p.weapon];

    const isRun = spriteName === "RUN";
    const meta = isRun ? PLAYER_RUN_META : SPRITE_META[spriteName];
    if (!meta) return;
    const table = isRun ? PLAYER_RUN_HAND : HAND_ANCHOR[spriteName];
    const angleTable = isRun ? PLAYER_RUN_ANGLE : HAND_ANGLE[spriteName];

    let idx = Math.floor(progress * meta.frames);
    idx = meta.loop ? ((idx % meta.frames) + meta.frames) % meta.frames : Math.min(meta.frames - 1, Math.max(0, idx));


    const isSwinging = spriteName === "LIGHT" || spriteName === "HEAVY" || spriteName === "BLOCK";

    let handPx, handPy, baseAngle;
    if (!isSwinging && p.weapon !== "fists") {
      handPx = meta.fw * 0.95; handPy = meta.fh * 0.62; baseAngle = 0.22;
    } else if (table) {
      [handPx, handPy] = table[idx];
      baseAngle = angleTable[idx];
    } else {

      handPx = meta.fw * 0.85; handPy = meta.fh * 0.65; baseAngle = 1.05;
    }
    const footAnchor = isRun ? meta.fw / 2 : (SPRITE_FOOT_X[spriteName]?.[idx] ?? meta.fw / 2);

    const scale = PLAYER_DRAW_H / meta.fh;
    const handX = p.x + p.facing * scale * (handPx - footAnchor);
    const handY = p.y - PLAYER_DRAW_H + handPy * scale;
    const angle = p.facing === 1 ? baseAngle : Math.PI - baseAngle;

    ctx.save();
    ctx.translate(Math.round(handX), Math.round(handY));
    ctx.rotate(angle);
    ctx.fillStyle = w.color;

    if (p.weapon === "knuckles") {
 
      ctx.restore();
      return;
    } else if (p.weapon === "bat") {
      ctx.fillRect(0, -2, 18, 4);                              
      ctx.fillStyle = "#5a3d22"; ctx.fillRect(0, -2, 5, 4);     
    } else if (p.weapon === "pipe") {
      ctx.fillRect(0, -2, 19, 4);
      ctx.fillStyle = "#5c6b74"; ctx.fillRect(0, -2, 2, 4); ctx.fillRect(16, -2, 2, 4); 
    }
    ctx.restore();
  }

  enemySprite(kind, name) {
    const key = `${kind}:${name}`;
    this.enemySpriteCache ||= {};
    if (this.enemySpriteCache[key]) return this.enemySpriteCache[key];
    const source = uniformSprite(this.sprites[name], name, true);
    const canvas = document.createElement("canvas"); canvas.width = source.width; canvas.height = source.height;
    const c = canvas.getContext("2d"); c.imageSmoothingEnabled = false; c.drawImage(source, 0, 0);

    const visual = ENEMY_VISUAL[kind] || ENEMY_VISUAL.grunt;
    bakeCssFilter(canvas, visual.filter);

    const faceSpriteName = BOSS_FACE_SPRITE[kind];
    const faceImg = faceSpriteName && this.sprites[faceSpriteName];
    if (faceImg) {
      this.headBoxCache ||= {};
      if (!this.headBoxCache[name]) this.headBoxCache[name] = detectHeadBoxes(this.sprites[name], name);
      paintBossFace(c, faceImg, this.headBoxCache[name]);
    }

    this.enemySpriteCache[key]=canvas; return canvas;
  }

  drawEnemySpriteFrame(kind, name, progress, x, y, drawH, facing, filter) {
    const img=this.enemySprite(kind,name), meta=SPRITE_META[name];
    let idx=Math.floor(progress*meta.frames); idx=meta.loop ? ((idx%meta.frames)+meta.frames)%meta.frames : Math.min(meta.frames-1,Math.max(0,idx));
    const scale=drawH/meta.fh, drawW=meta.fw*scale, foot=(SPRITE_FOOT_X[name]?.[idx] ?? meta.fw/2);
    const anchoredX=x-facing*(foot-meta.fw/2)*scale;
    this.ctx.save(); this.ctx.translate(Math.round(anchoredX),Math.round(y)); if(facing===-1)this.ctx.scale(-1,1);
    if (filter) this.ctx.filter = filter;
    this.ctx.drawImage(img,idx*meta.fw,0,meta.fw,meta.fh,Math.round(-drawW/2),Math.round(-drawH),Math.round(drawW),Math.round(drawH));
    this.ctx.filter = "none";
    this.ctx.restore();
  }

  drawEnemy(e) {
    const ctx = this.ctx;
    if (e.x < this.cameraX - 60 || e.x > this.cameraX + GAME_W + 60) return;
    const dying = e.state === "dead";
    const visual = ENEMY_VISUAL[e.kind] || ENEMY_VISUAL.grunt;
    const drawH = PLAYER_DRAW_H * (e.h / 32) * visual.scale;

    let spriteName = "IDLE", duration = 1, loop = true;
    switch (e.state) {
      case "spawn": spriteName = "IDLE"; duration = 0.45; loop = false; break;
      case "idle": spriteName = "IDLE"; duration = SPRITE_META.IDLE.frames / SPRITE_META.IDLE.fps; break;
      case "chase": spriteName = "RUN"; duration = SPRITE_META.RUN.frames / SPRITE_META.RUN.fps; break;
      case "windup": spriteName = "IDLE"; duration = 999; break;
      case "attack": {
        spriteName = ENEMY_ATTACK_SHEET[e.kind] || "LIGHT";
        duration = spriteName === "HEAVY" ? 0.5 : 0.28;
        loop = false;
        break;
      }
      case "recover": spriteName = "IDLE"; duration = 999; break;
      case "stagger": spriteName = "HURT"; duration = 0.3; loop = false; break;
      case "dead": spriteName = "DEATH"; duration = DEATH_DURATION; loop = false; break;
    }
    const progress = loop ? (e.stateTime % duration) / duration : Math.min(0.999, e.stateTime / duration);

    ctx.save();
    if (dying) ctx.globalAlpha = Math.max(0, 1 - e.stateTime * 5.5);
    else if (e.state === "spawn") ctx.globalAlpha = Math.min(1, e.stateTime / 0.45);

  
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(Math.round(e.x - (e.w * visual.scale) / 2), Math.round(e.y - 3), e.w * visual.scale, 3);

  
    let filter = null;
    const pulse = 0.5 + 0.5 * Math.sin(this.time * 20);
    if (e.state === "windup") {
      filter = `hue-rotate(-15deg) saturate(${2.4 + pulse}) brightness(${1.05 + pulse * 0.35})`;
    } else if (e.guardFlash > 0) {
      filter = "brightness(1.6) saturate(0.4)";
    }

    this.drawEnemySpriteFrame(e.kind, spriteName, progress, e.x, e.y, drawH, e.facing, filter);

    
    if (e.role === "thrower" && (e.state === "idle" || e.state === "chase" || e.state === "windup")) {
      ctx.fillStyle = "#7cff9b";
      ctx.fillRect(Math.round(e.x + e.facing * (e.w * 0.5 + 2)), Math.round(e.y - drawH * 0.62), 3, 5);
    }

    if (e.state === "windup") {
      ctx.globalAlpha *= 0.55 + pulse * 0.4;
      ctx.fillStyle = "#ff3b3b";
      ctx.beginPath();
      ctx.moveTo(e.x - 6, e.y - drawH - 15);
      ctx.lineTo(e.x + 6, e.y - drawH - 15);
      ctx.lineTo(e.x, e.y - drawH - 6);
      ctx.closePath();
      ctx.fill();
    }
    if (e.guardFlash > 0) {
      ctx.strokeStyle = "#cfd6ff"; ctx.lineWidth = 1;
      ctx.strokeRect(Math.round(e.x + e.facing * 6 - 4), Math.round(e.y - drawH * 0.7), 8, drawH * 0.4);
    }

    if (!dying && e.state !== "spawn" && !e.isBoss) {
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(Math.round(e.x - 10), Math.round(e.y - drawH - 12), 20, 2);
      ctx.fillStyle = "#e5484d"; ctx.fillRect(Math.round(e.x - 10), Math.round(e.y - drawH - 12), Math.max(0, (e.hp / e.maxHp) * 20), 2);
    }
    ctx.restore();
  }

  drawPickup(pk) {
    const ctx = this.ctx;
    if (pk.x < this.cameraX - 40 || pk.x > this.cameraX + GAME_W + 40) return;
    const bob = Math.sin(this.time * 4 + pk.x) * 2;
    const y = GROUND_Y - 8 + bob;
    ctx.save();
    ctx.globalAlpha = pk.life < 2.5 ? Math.max(0.15, pk.life / 2.5) : 1;
    ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(Math.round(pk.x - 6), GROUND_Y - 2, 12, 2);
    ctx.translate(Math.round(pk.x), Math.round(y));

    if (pk.type === "food") {
      const item = FOOD_ITEMS[pk.kind];
      if (pk.kind === "apple") {
        ctx.fillStyle = item.color; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#4f7a3a"; ctx.fillRect(-1, -6, 3, 3);
      } else {
        ctx.fillStyle = item.color; ctx.fillRect(-3, -7, 6, 12);
        ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fillRect(-3, -4, 6, 2);
      }
    } else {
      const w = WEAPONS[pk.kind];
      ctx.fillStyle = w.color;
      if (pk.kind === "bat") { ctx.rotate(-0.6); ctx.fillRect(-2, -10, 4, 16); ctx.fillStyle = "#8a5a2f"; ctx.fillRect(-2, 4, 4, 4); }
      else if (pk.kind === "pipe") { ctx.rotate(-0.3); ctx.fillRect(-2, -9, 4, 18); ctx.fillStyle = "#5c6b74"; ctx.fillRect(-2, -9, 4, 2); ctx.fillRect(-2, 7, 4, 2); }
      else {
        
        const img = this.sprites.KNUCKLE_ITEM;
        if (img && img.complete && img.naturalWidth) {
          ctx.rotate(-0.45);
          const dw = 20, dh = Math.round(20 * img.naturalHeight / img.naturalWidth);
          ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
        } else {
          ctx.restore();
          this.drawBrassKnuckle(pk.x, y, -0.45, 0.9);
          return;
        }
      }
    }
    ctx.restore();
  }

  emitHud() {
    const boss = this.enemies.find((e) => e.isBoss && e.state !== "dead");
    const p = this.player;
    const weapon = WEAPONS[p.weapon];
    this.onHud({
      hp: Math.max(0, Math.round(p.hp)), maxHp: p.maxHp, rage: Math.round(p.rage),
      stamina: Math.round(p.stamina), maxStamina: p.maxStamina,
      heavyCooldown: p.heavyCooldown, heavyCooldownMax: HEAVY_COOLDOWN,
      floorName: this.floor.name, floorSubtitle: this.floor.subtitle, floorIndex: this.floorIndex,
      enemiesLeft: this.enemies.filter((e) => e.state !== "dead").length, combo: p.combo,
      bossName: boss ? ENEMY_NAMES[boss.kind] : null, bossHp: boss ? Math.max(0, Math.round(boss.hp)) : 0,
      bossMaxHp: boss ? boss.maxHp : 1, status: this.status,
      weaponName: weapon.name, weaponDurability: p.durability, weaponMaxDurability: p.maxDurability,
      attackBoost: p.attackBoost > 0,
    });
  }
}
</script>
<script>
(function () {
  const canvas = document.getElementById("game");

  const names = [...Object.keys(SPRITE_DATA), "PLAYER_RUN", "PLAYER_RUN_KNUCKLES", "KNUCKLE_ITEM"];
  let loaded = 0;
  const sprites = {};
  names.forEach((n) => {
    const img = new Image();
    const done = () => { loaded++; if (loaded === names.length) boot(); };
    img.onload = done;
    img.onerror = done;
    img.src = n === "PLAYER_RUN" ? PLAYER_RUN_URL : n === "PLAYER_RUN_KNUCKLES" ? PLAYER_RUN_KNUCKLES_URL : n === "KNUCKLE_ITEM" ? KNUCKLE_ITEM_URL : "data:image/png;base64," + SPRITE_DATA[n];
    sprites[n] = img;
  });

  function boot() {
    const game = new Game(canvas, sprites);
    window.game = game;

    const hudFloorName = document.getElementById("hud-floor-name");
    const hudFloorSub = document.getElementById("hud-floor-sub");
    const hudEnemies = document.getElementById("hud-enemies");
    const hudHpText = document.getElementById("hud-hp-text");
    const hudHpBar = document.getElementById("hud-hp-bar");
    const hudHpSurface = document.getElementById("hud-hp-surface");
    const hudRageBar = document.getElementById("hud-rage-bar");
    const hudStaminaBar = document.getElementById("hud-stamina-bar");
    const hudBoost = document.getElementById("hud-boost");
    const hudWeaponName = document.getElementById("hud-weapon-name");
    const hudWeaponBar = document.getElementById("hud-weapon-bar");
    const weaponPanel = document.getElementById("weapon-panel");
    const bossbar = document.getElementById("bossbar");
    const bossName = document.getElementById("boss-name");
    const bossHp = document.getElementById("boss-hp");

    game.onHud = (h) => {
      hudFloorName.textContent = h.floorName;
      hudFloorSub.textContent = h.floorSubtitle;
      hudEnemies.textContent = h.enemiesLeft;
      hudHpText.textContent = `${h.hp}/${h.maxHp}`;
      const healthRatio = Math.max(0, Math.min(1, h.hp / h.maxHp));
      const bloodTop = 76 - healthRatio * 72;
      hudHpBar.setAttribute("y", bloodTop);
      hudHpBar.setAttribute("height", healthRatio * 72);
      hudHpSurface.setAttribute("cy", bloodTop);
      hudRageBar.style.width = `${h.rage}%`;
      hudStaminaBar.style.width = `${(h.stamina / h.maxStamina) * 100}%`;
      hudBoost.style.display = h.attackBoost ? "inline-block" : "none";
      weaponPanel.style.display = h.weaponMaxDurability === Infinity ? "none" : "block";
      hudWeaponName.textContent = h.weaponName;
      hudWeaponBar.style.width = h.weaponMaxDurability === Infinity
        ? "100%"
        : `${Math.max(0, (h.weaponDurability / h.weaponMaxDurability) * 100)}%`;
      if (h.bossName) {
        bossbar.style.display = "block";
        bossName.textContent = h.bossName;
        bossHp.style.width = `${(h.bossHp / h.bossMaxHp) * 100}%`;
      } else {
        bossbar.style.display = "none";
      }
    };


    game.start();

    // ---- debug cheat: type `onehitmode` in the browser console and hit enter ----
    // (a leading "/" isn't valid JS in the console, so the bare word toggles it instead)
    Object.defineProperty(window, "onehitmode", {
      configurable: true,
      get() {
        game.oneHitMode = !game.oneHitMode;
        const msg = game.oneHitMode
          ? "[CHEAT] One-hit mode ENABLED — punches now one-shot enemies. Type onehitmode again to turn it off."
          : "[CHEAT] One-hit mode disabled.";
        console.log(msg);
        return msg;
      },
    });

    // ---- debug cheat: type `godmode` in the browser console and hit enter ----
    Object.defineProperty(window, "godmode", {
      configurable: true,
      get() {
        game.godMode = !game.godMode;
        const msg = game.godMode
          ? "[CHEAT] God mode ENABLED — you take no damage. Type godmode again to turn it off."
          : "[CHEAT] God mode disabled.";
        console.log(msg);
        return msg;
      },
    });

    // ---- fullscreen ----
    const fullscreenBtn = document.getElementById("fullscreen-btn");
    const stage = document.getElementById("stage");
    function updateFullscreenLabel() {
      const active = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      fullscreenBtn.setAttribute("aria-label", active ? "Exit fullscreen" : "Enter fullscreen");
      fullscreenBtn.setAttribute("title", active ? "Exit fullscreen" : "Fullscreen");
    }
    fullscreenBtn.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) await exit.call(document);
        } else {
          const request = stage.requestFullscreen || stage.webkitRequestFullscreen;
          if (request) await request.call(stage);
        }
      } catch (error) {
        console.warn("Fullscreen is not available in this browser", error);
      }
    });
    document.addEventListener("fullscreenchange", updateFullscreenLabel);
    document.addEventListener("webkitfullscreenchange", updateFullscreenLabel);

    // ---- pause / restart buttons ----
    const pauseBtn = document.getElementById("pause-btn");
    const restartBtn = document.getElementById("restart-btn");
    game.onPause = (paused) => {
      pauseBtn.classList.toggle("active", paused);
      pauseBtn.setAttribute("aria-label", paused ? "Resume" : "Pause");
      pauseBtn.querySelector(".sys-label").textContent = paused ? "RESUME" : "PAUSE";
    };
    pauseBtn.addEventListener("click", (e) => { e.preventDefault(); game.togglePause(); });
    restartBtn.addEventListener("click", (e) => { e.preventDefault(); game.restart(); });

    // ---- keyboard ----
    const KEY_MAP = {
      ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
      ArrowUp: "up", KeyW: "up", Space: "up", ArrowDown: "down", KeyS: "down",
      KeyJ: "light", KeyK: "heavy", KeyL: "block", KeyF: "block", ShiftLeft: "roll", ShiftRight: "roll", KeyU: "roll",
      KeyE: "grab", KeyH: "heal",
    };
    function onKey(e, down) {
      if (e.code === "KeyR" && down) { game.restart(); return; }
      if ((e.code === "KeyP" || e.code === "Escape") && down) { game.togglePause(); return; }
      const action = KEY_MAP[e.code];
      if (!action) return;
      e.preventDefault();
      game.setInput({ [action]: down });
      syncButtonVisual(action, down);
    }
    window.addEventListener("keydown", (e) => onKey(e, true));
    window.addEventListener("keyup", (e) => onKey(e, false));

  
    function syncButtonVisual(action, down) {
      document.querySelectorAll(`[data-action="${action}"]`).forEach((b) => b.classList.toggle("held", down));
    }
    document.querySelectorAll("[data-action]").forEach((btn) => {
      const action = btn.getAttribute("data-action");
      const down = (ev) => { ev.preventDefault(); if (game.paused) return; game.setInput({ [action]: true }); btn.classList.add("held"); };
      const up = (ev) => { ev.preventDefault(); game.setInput({ [action]: false }); btn.classList.remove("held"); };
      btn.addEventListener("pointerdown", down);
      btn.addEventListener("pointerup", up);
      btn.addEventListener("pointerleave", up);
      btn.addEventListener("pointercancel", up);
      // stop long-press from triggering the OS context menu / text-selection callout
      btn.addEventListener("contextmenu", (ev) => ev.preventDefault());
      btn.addEventListener("touchstart", (ev) => ev.preventDefault(), { passive: false });
      btn.addEventListener("touchend", (ev) => ev.preventDefault(), { passive: false });
    });

   
    document.getElementById("stage").addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

   
    document.addEventListener("selectstart", (e) => e.preventDefault());
    document.addEventListener("dblclick", (e) => e.preventDefault());

   
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    canvas.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse") {
        e.preventDefault();
        if (e.button === 0) { game.setInput({ light: true }); syncButtonVisual("light", true); }
        else if (e.button === 2) { game.setInput({ heavy: true }); syncButtonVisual("heavy", true); }
      }
    });
    window.addEventListener("pointerup", (e) => {
      if (e.pointerType === "mouse") {
        if (e.button === 0) { game.setInput({ light: false }); syncButtonVisual("light", false); }
        else if (e.button === 2) { game.setInput({ heavy: false }); syncButtonVisual("heavy", false); }
      }
    });
  }
})();
</script>
</body>
</html>
